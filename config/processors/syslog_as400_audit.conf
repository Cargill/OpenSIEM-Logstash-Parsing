input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "event", "host" ]
  }
  mutate {
    add_field => {
      "[event][module]" => "as400"
      "[event][dataset]" => "as400.audit"
    }
  }
  dissect {
    mapping => {
      "message" => '%{?data} {name=%{?data}} %{syslog_msg}'
    }
  }
  mutate {
    gsub => [
      "syslog_msg", "^\\u00E9", "{",
      "syslog_msg", "\\u00E8$", "}"
    ]
  }
  json {
    source => "syslog_msg"
    target => "tmp"
  }
  ruby {
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  mutate {
    rename => {
      "[tmp][c_system]" => "[host][name]"
      "[tmp][d_event]" => "[event][id]"
      "[tmp][e_command]" => "[process][command_line]"
      "[tmp][f_remote_ip_add]" => "[host][ip]"
      "[tmp][g_job_name]" => "[rule][name]"
      "[tmp][h_job_number]" => "[rule][id]"
      "[tmp][i_job_user]" => "[user][name]"
    }
  }
  if [host][name] {
    mutate {
      add_field => { "[log][source][hostname]" => "%{[host][name]}" }
    }
  }
  mutate {
    add_field => { "[event][created]" => "%{[tmp][a_date]} %{[tmp][b_time]}" }
  }
  #2023-02-08 07.03.36
  date {
    match => [ "[event][created]" , "yyyy-MM-dd HH.mm.ss" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  mutate {
    remove_field => [ "tmp", "syslog_msg" ]
  }
}
output {
  pipeline { send_to => [enrichments] }
}
