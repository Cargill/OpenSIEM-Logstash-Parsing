input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "event", "host" ]
  }
  mutate {
    add_field => {
      "[event][module]" => "box.com"
      "[event][dataset]" => "box.com_msg"
      "[log][source][hostname]" => "box.com_api"
    }
  }
  json {
    source => "message"
    target => "tmp"
  }
  mutate {
    rename => {
      "[tmp][event_type]" => "[event][action]"
    }
  }

  # DO NOT move below the global field mapping due to file.path field precedence
  if [event][action] == "RENAME" or [event][action] == "UNSHARE" or [event][action] == "UPLOAD" or  [event][action] == "ITEM_SHARED_UPDATE" or [event][action] == "COPY" or [event][action] == "EDIT" or [event][action] == "FILE_MARKED_MALICIOUS" or [event][action] == "ITEM_MODIFY" or [event][action] == "ITEM_OPEN" or [event][action] == "LOCK" or [event][action] == "ITEM_OPEN" or [event][action] == "METADATA_INSTANCE_CREATE" or [event][action] == "DOWNLOAD" or [event][action] == "PREVIEW" or [event][action] == "STORAGE_EXPIRATION" or [event][action] == "TASK_ASSIGNMENT_CREATE" or [event][action] == "TASK_ASSIGNMENT_UPDATE" or [event][action] == "TASK_CREATE" or [event][action] == "TASK_UPDATE" or [event][action] == "UNDELETE" or [event][action] == "TASK_UPDATE" or [event][action] == "UNLOCK" or [event][action] == "ANNOTATIONV2_CREATE" or [event][action] == "ANNOTATIONV2_DELETE" or [event][action] == "FAVORITE" {
    mutate {
      rename => {
        "[tmp][source][parent][name]" => "[file][name]"
        "[tmp][additional_details][file_path]" => "[file][path]"
      }
    }
  } else if [event][action] == "COLLABORATION_INVITE" {
    mutate {
      rename => {
        "[tmp][created_by][name]" => "[source][user][full_name]"
        "[tmp][accessible_by][login]" => "[destination][user][email]"
      }
      remove_field => [ "[tmp][source][owned_by][name]" ]
    }
  }
  # global field mapping
  mutate {
    rename => {
      "[tmp][source][item_type]" => "[file][type]"
      "[tmp][source][item_id]" => "[file][uid]"
      "[tmp][source][file_id]" => "[file][uid]"
      "[tmp][source][api_key]" => "[tls][client][x509][serial_number]"
      "[tmp][source][item_name]" => "[file][name]"
      "[tmp][source][file_name]" => "[file][name]"
      "[tmp][source][parent][name]" => "[file][path]"
      "[tmp][source][parent][type]" => "[file][type]"
      "[tmp][created_by][login]" => "[source][user][email]"
      "[tmp][created_at]" => "[event][created]"
      "[tmp][event_id]" => "[event][id]"
      "[tmp][created_by][name]" => "[file][owner]"
      "[tmp][type]" => "[event][type]"
      "[tmp][additional_details][size]" => "[file][size]"
      "[tmp][file_path]" => "[file][path]"
      "[tmp][additional_details][file_path]" => "[file][path]"
      "[tmp][additional_details][service_id]" => "[service][id]"
      "[tmp][additional_details][service_name]" => "[process][name]"
      "[tmp][created_by][id]" => "[source][user][id]"
      "[tmp][source][owned_by][name]" => "[source][user][full_name]"
      "[tmp][additional_details][collab_id]" => "[service][id]"
      "[tmp][additional_details][type]" => "[service][type]"
      "[tmp][additional_details][group_name]" => "[service][name]"
      "[tmp][ip_address]" => "[source][ip]"
      "[tmp][additional_details][message]" => "[error][message]"
      "[tmp][additional_details][scan_type]" => "[vulnerability][scanner][vendor]"
      "[tmp][additional_details][recipient][login]" => "[destination][user][email]"
      "[tmp][additional_details][recipient][name]" => "[destination][user][name]"
      "[tmp][additional_details][security_information][accessFromSharedObject][accessLevel]" => "[file][new_acl]"
      "[tmp][additional_details][sharedLinkSettings][newVisibilityStatus]" => "[file][new_acl]"
      "[tmp][additional_details][sharedLinkSettings][oldVisibilityStatus]" => "[file][old_acl]"
      "[tmp][additional_details][security_information][accessFromSharedObject][sharedName]" => "[file][sharename]"
      "[tmp][additional_details][security_information][accessFromSharedObject][createdAt]" => "[file][created]"
      "[tmp][additional_details][recipient_email]" => "[destination][user][email]"
      "[tmp][additional_details][shield_alert][rule_category]" => "[rule][category]"
      "[tmp][additional_details][shield_alert][rule_id]" => "[rule][uuid]"
      "[tmp][additional_details][shield_alert][rule_name]" => "[rule][name]"
      "[tmp][additional_details][shield_alert][rule_response_action]" => "[rule][ruleset]"
      "[tmp][additional_details][shield_alert][risk_score]" => "[event][risk_score]"
      "[tmp][additional_details][shield_alert][alert_summary][description]" => "[rule][description]"
      "[tmp][additional_details][annotation_id]" => "[transaction][id]"
      "[tmp][additional_details][collection][user][name]" => "[destination][user][full_name]"
      "[tmp][additional_details][collection][user][email]" => "[destination][user][email]"
      "[tmp][additional_details][collection][user][id]" => "[destination][user][id]"
      "[tmp][additional_details][domain_verification][emailDomain]" => "[url][domain]"
      "[tmp][additional_details][shield_alert][alert_summary][historical_period][date_range][start_date]" => "[event][start]"
      "[tmp][additional_details][shield_alert][alert_summary][historical_period][date_range][end_date]" => "[event][end]"
      "[tmp][additional_details][shield_alert][alert_id]" => "[rule][id]"
      "[tmp][additional_details][shield_alert][priority]" => "[event][severity]"
      "[tmp][additional_details][shield_alert][user][id]" => "[destination][user][id]"
      "[tmp][additional_details][shield_alert][user][name]" => "[destination][user][name]"
      "[tmp][additional_details][shield_alert][user][email]" => "[destination][user][email]"
      "[tmp][additional_details][shield_alert][link]" => "[rule][reference]"
    }
  }
  ruby {
    code => "
      data_ip = []
      data_registrant = []
      if event.get('[tmp][additional_details][shield_alert][alert_summary][download_ips]').kind_of?(Array)
        event.get('[tmp][additional_details][shield_alert][alert_summary][download_ips]').each do |item|
          data_ip.push(item['ip'])
          data_registrant.push(item['registrant'])
        end
        event.set('[destination][ip]', data_ip)
        event.set('[observer][vendor]', data_registrant)
      end
    "
    tag_on_exception => "ruby_block_exception_1"
  }
  if [event][action] == "UPLOAD" {
    mutate {
      copy => { "[file][owner]" => "[source][user][full_name]" }
    }
  }
  if [event][action] == "ADVANCED_FOLDER_SETTINGS_UPDATE" {
    mutate {
      rename => {
        "[tmp][source][login]" => "[user][email]"
        "[tmp][source][name]" => "[user][full_name]"
      }
    }
  } else if [event][action] == "COLLABORATION_EXPIRATION" or [event][action] == "COLLABORATION_ACCEPT" or [event][action] == "COLLABORATION_REMOVE" or [event][action] == "COLLABORATION_REMOVE" or [event][action] == "COLLABORATION_ROLE_CHANGE" {
    mutate {
      rename => {
        "[tmp][source][user_email]" => "[source][user][email]"
        "[tmp][source][folder_name]" => "[file][name]"
        "[tmp][source][folder_id]" => "[file][uid]"
        "[tmp][source][name]" => "[user][full_name]"
        "[tmp][accessible_by][name]" => "[assignee][user][name]"
        "[tmp][accessible_by][login]" => "[assignee][user][email]"
      }
    }
  } else if [event][action] == "CHANGE_ADMIN_ROLE" or [event][action] == "NEW_USER"  {
    mutate {
      rename => {
        "[tmp][source][id]" => "[user][id]"
        "[tmp][source][login]" => "[source][user][email]"
        "[tmp][source][name]" => "[user][full_name]"
      }
    }
  } else if [event][action] == "EDIT_USER" or [event][action] == "GROUP_ADD_USER" or [event][action] == "GROUP_REMOVE_USER" or [event][action] == "INTERNAL_ADMIN_MIGRATE_USER_IN"  or [event][action] == "INTERNAL_ADMIN_MIGRATE_USER_OUT" {
      mutate {
        rename => {
          "[tmp][source][id]" => "[user][id]"
          "[tmp][source][login]" => "[source][user][email]"
          "[tmp][source][name]" => "[user][full_name]"
        }
      }
  }else if [event][action] == "METADATA_INSTANCE_CREATE" or [event][action] == "METADATA_INSTANCE_UPDATE" {

    grok {
      match => { '[tmp][additional_details][metadata][operationParams]' => '\[(?<data>{.*})\]' }
    }
    json {
      source => "[data]"
      target => "[tmp_data]"
    }
    mutate {
      rename => {
        "[tmp_data][op]" => "[event][reason]"
        "[tmp_data][path]" => "[event][reference]"
        "[tmp][additional_details][metadata][type]" => "[file][type]"
      }
    }
  }else if [event][action] == "DOWNLOAD" {
    mutate {
      rename => {
       "[source][ip]" => "[destination][ip]"
       "[source][user][id]" => "[destination][user][id]"
       "[source][user][email]" => "[destination][user][email]"
      }
      remove_field => [ "[source][user][full_name]"]
      copy => { "[file][owner]" => "[destination][user][full_name]" }
    }
  }else if [event][action] == "TASK_ASSIGNMENT_CREATE" or [event][action] == "TASK_ASSIGNMENT_UPDATE" or [event][action] == "TASK_CREATE" or [event][action] == "TASK_UPDATE" {
    mutate {
      rename => {
        "[tmp][additional_details][task][created_by][login]" => "[source][user][email]"
        "[tmp][additional_details][task][created_by][id]" => "[source][user][id]"
        "[tmp][additional_details][task_assignment][assigned_to][login]" => "[destination][user][email]"
        "[tmp][additional_details][task_assignment][assigned_to][id]" => "[destination][user][id]"
      }
      remove_field => [ "[source][user][full_name]"]
    }
  }
  if [source][ip] == "Unknown IP" {
    mutate {
      remove_field => [ "[source][ip]" ]
    }
  }
  if [tmp][additional_details][hash_type] == "sha1" {
    mutate {
      rename => {
        "[tmp][additional_details][file_hash]" => "[file][hash][sha1]"
      }
    }
  } else if [tmp][additional_details][hash_type] == "md5" {
    mutate {
      rename => {
        "[tmp][additional_details][file_hash]" => "[file][hash][md5]"
      }
    }
  } else if [tmp][additional_details][hash_type] == "sha256" {
    mutate {
      rename => {
        "[tmp][additional_details][file_hash]" => "[file][hash][sha256]"
      }
    }
  } else if [tmp][additional_details][hash_type] == "sha512" {
    mutate {
      rename => {
        "[tmp][additional_details][file_hash]" => "[file][hash][sha512]"
      }
    }
  } else if [tmp][additional_details][hash_type] == "sha512" {
    mutate {
      rename => {
        "[tmp][additional_details][file_hash]" => "[file][hash][sha512]"
      }
    }
  } else if [tmp][additional_details][hash_type] == "ssdeep" {
    mutate {
      rename => {
        "[tmp][additional_details][file_hash]" => "[file][hash][ssdeep]"
      }
    }
  }
  date {
    match => ["[event][created]", "yyyy-MM-dd'T'HH:mm:ssZZ"]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  date {
    match => ["[file][created]", "yyyy-MM-dd'T'HH:mm:ssZZ"]
    timezone => "GMT"
    locale => "en"
    target => "[file][created]"
    tag_on_failure => "_filedateparsefailure_ec"
  }
  date {
    match => ["[event][start]", "yyyy-MM-dd'T'HH:mm:ssZZ"]
    timezone => "GMT"
    locale => "en"
    target => "[event][start]"
    tag_on_failure => "_event_start_dateparsefailure_ec"
  }
  date {
    match => ["[event][end]", "yyyy-MM-dd'T'HH:mm:ssZZ"]
    timezone => "GMT"
    locale => "en"
    target => "[event][end]"
    tag_on_failure => "_event_end_dateparsefailure_ec"
  }
  mutate {
    remove_field => ["tmp", "tmp_data", "data"]
  }
}
output {
  pipeline { send_to => [enrichments] }
}
