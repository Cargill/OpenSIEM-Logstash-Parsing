input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "event", "host" ]
  }
  mutate {
    add_field => { "[event][module]" => "wiz_webhook" }
    add_field => { "[event][dataset]" => "wiz_webhook.alert" }
    add_field => { "[log][source][hostname]" => "wiz_webhook" }
  }
  json {
    source => "message"
    target => "wiz"
  }
  ruby {
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  mutate {
    rename => {
      "[wiz][trigger][type]" => "[event][type]"
      "[wiz][trigger][ruleid]" => "[rule][id]"
      "[wiz][trigger][rulename]" => "[rule][name]"
      "[wiz][trigger][source]" => "[error][type]"
      "[wiz][event][name]" => "[event][code]"
      "[wiz][event][eventurl]" => "[event][reference]"
      "[wiz][event][cloudplatform]" => "[cloud][provider]"
      "[wiz][event][source]" => "[source][address]"
      "[wiz][event][category]" => "[event][category]"
      "[wiz][event][actor][name]" => "[source][user][name]"
      "[wiz][event][actor][ip]" => "[source][ip]"
      "[wiz][event][subjectresource][name]" => "[threat][tactic][name]"
      "[wiz][event][subjectresource][type]" => "[cloud][machine][type]"
      "[wiz][event][subjectresource][provideruniqueid]" => "[cloud][instance][id]"
      "[wiz][event][subjectresource][externalid]" => "[cloud][account][id]"
      "[wiz][event][subjectresource][region]" => "[cloud][region]"
      "[wiz][event][subjectresource][account]" => "[cloud][account][name]"
      "[wiz][issue][id]" => "[event][id]"
      "[wiz][issue][status]" => "[event][outcome]"
      "[wiz][issue][severity]" => "[event][severity_name]"
      "[wiz][issue][projects]" => "[cloud][project][name]"
      "[wiz][issue][created]" => "[event][created]" 
      "[wiz][resource][id]" => "[cloud][instance][id]"
      "[wiz][resource][name]" => "[cloud][instance][name]"
      "[wiz][resource][type]" => "[cloud][machine][type]"
      "[wiz][resource][cloudplatform]" => "[cloud][provider]"
      "[wiz][resource][subscriptionid]" => "[cloud][account][id]"
      "[wiz][resource][subscriptionname]" => "[cloud][account][name]"
      "[wiz][resource][region]" => "[cloud][region]"
      "[wiz][resource][cloudproviderurl]" => "[rule][reference]"
      "[wiz][resource][status]" => "[event][action]"
      "[wiz][control][id]" => "[rule][id]"
      "[wiz][control][name]" => "[rule][name]"
      "[wiz][control][description]" => "[rule][description]"
      "[wiz][control][severity]" => "[event][severity_name]"
      "[wiz][threat][severity]" => "[event][severity_name]"
      "[wiz][threat][projects]" => "[cloud][project][name]"
      "[wiz][threat][tdrnames]" => "[rule][name]"
      "[wiz][threat][description]" => "[rule][description]"
      "[wiz][threat][created]" => "[event][created]" 
      "[wiz][threat][mitretechniques]" => "[threat][technique][id]"
      "[wiz][threat][status]" => "[event][outcome]"
      "[wiz][threat][threaturl]" => "[event][reference]"
      "[wiz][threat][mitretactics]" => "[threat][tactic][id]"
      "[wiz][threat][id]" => "[error][id]"
    }
  }
  
  if [wiz][threat][resources][0][type] == "network address" {
    mutate {
      rename => {
        "[wiz][threat][resources][0][externalid]" => "[source][ip]"
      }
    }
  }
  if [wiz][threat][resources][0][type] == "virtual machine" {
    mutate {
      rename => {
        "[wiz][threat][resources][0][externalid]" => "[cloud][instance][id]"
      }
    }
  }
  if [wiz][threat][resources][0][type] == "network interface" {
    mutate {
      rename => {
        "[wiz][threat][resources][0][externalid]" => "[observer][egress][interface][id]"
      }
    }
  }
  if [wiz][threat][resources][1][type] == "network address" {
    mutate {
      rename => {
        "[wiz][threat][resources][1][externalid]" => "[source][ip]"
      }
    }
  }
  if [wiz][threat][resources][1][type] == "virtual machine" {
    mutate {
      rename => {
        "[wiz][threat][resources][1][externalid]" => "[cloud][instance][id]"
      }
    }
  }
  if [wiz][threat][resources][1][type] == "network interface" {
    mutate {
      rename => {
        "[wiz][threat][resources][1][externalid]" => "[observer][egress][interface][id]"
      }
    }
  }
  if [wiz][threat][resources][2][type] == "network address" {
    mutate {
      rename => {
        "[wiz][threat][resources][2][externalid]" => "[source][ip]"
      }
    }
  }
  if [wiz][threat][resources][2][type] == "virtual machine" {
    mutate {
      rename => {
        "[wiz][threat][resources][2][externalid]" => "[cloud][instance][id]"
      }
    }
  }
  if [wiz][threat][resources][2][type] == "network interface" {
    mutate {
      rename => {
        "[wiz][threat][resources][2][externalid]" => "[observer][egress][interface][id]"
      }
    }
  }
  
  # "2024-12-17t00:45:35.017472z"
  date {
    match => [ "[event][created]", "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
  }
  mutate {
    remove_field => [ "wiz" ]
  }
}
output {
  pipeline { send_to => [enrichments] }
}
