# Ansible alert web hook to logstash https listener
input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "host","event" ]
  }
  mutate {
    add_field  => { 
      "[agent][name]" => "eventhub_error_log"
      "[agent][type]" => "eventhub" 
      "[event][dataset]" => "eventhub.dlq"
      "[event][module]" => "eventhub"
	  }
  }
  json {
    source => "message"
	target => "tmp"
  } 
  mutate {
    rename => {
      "[tmp][Timestamp]" => "[event][created]"
      "[tmp][Job]" => "[error][type]"
      "[tmp][Description]" => "[error][code]"
      "[tmp][Content]" => "[event][original]"
    }
  }
  date {
    match => [ "[event][created]", "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  mutate {
    copy => { "[error][type]" => "[log][source][hostname]" }
    remove_field => [ "tmp" ]
  }
}
output {
  pipeline { send_to => [enrichments] }
}
