      "[az][endtime]" => "[event][end]"
      "[az][starttime]" => "[event][end]"
      "[az][timegenerated]" => "[process][start]"
      "[az][processingendtime]" => "[event][ingested]"
      "[az][tactics]" => "[threat][tactic][name]"
      "[az][alertname]" => "[rule][name]"
      "[az][alertseverity]" => "[event][severity_name]"
      "[az][windowsdefenderav]" => "[rule][name]"
