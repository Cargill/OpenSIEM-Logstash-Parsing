            usr_usersid_list.push(evd['useraccount']['usersid'])
            event.set('[user][id]', usr_usersid_list)
          end
        end
      end
    "
    tag_on_exception => ""
  }
  ruby {
    code => "
      detectionstatus_list = []
      if event.get('[az][evidence]').kind_of?(Array)
        event.get('[az][evidence]').each do |evd|
          if !evd['detectionstatus'].nil? && evd['detectionstatus'] != ''
            detectionstatus_list.push(evd['detectionstatus'])
            event.set('[event][outcome]', detectionstatus_list)
          end
        end
      end
    "
    tag_on_exception => ""
  }

		  
  ruby {
    code => "
      filehashes_sha256_list = []
      filehashes_sha1_list = []
      filehashes_md5_list = []
      file_directory = []
      file_name = []
      file_path = []
	  loggedonusers_list = []
	  lastexternalipaddress_list = []
	  osfamily_list = []
	  avstatus_list = []
	  osversion_list = []
	  tags_list = []
      lastipaddress_list = []
      log_riskscore_name = []
      host_hostname = []
      privateipaddress_list = []
      publicipaddress_list = []
      os_list = []
      riskscore_list = []
      healthstatus_list = []
	  
      verdict_list = []
      usr_displayname_list = []
      usr_userprincipalname_list = []
      usr_domainname_list = []
      usr_accountname_list = []
      usr_usersid_list = []
      usr_roles_list = []
      usr_useragent_list = []
      detailedroles_list = []
      protocol_list = []
      operatingsystem_list = []
      ipaddress_list = []
      countrylettercode_list = []
      geo_city_list = []
      geo_state_list = []
      geo_lat_list = []
      geo_long_list = []
      hostname_list = []
      onboardingstatus_list = []
      devicednsname_list = []
      rbacgroupname_list = []
      dnsdomain_list =  []
      if event.get('[az][evidence]').kind_of?(Array)
        event.get('[az][evidence]').each do |evd|
          if !evd['verdict'].nil? && evd['verdict'] != ''
            verdict_list.push(evd['verdict'])
          end
          if !evd['roles'].nil? && evd['roles'] != ''
            usr_roles_list.push(evd['roles'])
          end
          if !evd['useragent'].nil? && evd['useragent'] != ''
            usr_useragent_list.push(evd['useragent'])
          end
          if !evd['detailedroles'].nil? && evd['detailedroles'] != ''
            detailedroles_list.push(evd['detailedroles'])
          end
          if !evd['protocol'].nil? && evd['protocol'] != ''
            protocol_list.push(evd['protocol'])
          end
          if !evd['operatingsystem'].nil? && evd['operatingsystem'] != ''
            operatingsystem_list.push(evd['operatingsystem'])
          end
          if !evd['ipaddress'].nil? && evd['ipaddress'] != ''
            ipaddress_list.push(evd['ipaddress'])
          end
          if !evd['countrylettercode'].nil? && evd['countrylettercode'] != ''
            countrylettercode_list.push(evd['countrylettercode'])
          end
          if !evd['lastipaddress'].nil? && evd['lastipaddress'] != ''
            lastipaddress_list.push(evd['lastipaddress'])
          end
          if !evd['riskscore'].nil? && evd['riskscore'] != ''
            riskscore_list.push(evd['riskscore'])
          end
          if !evd['hostname'].nil? && evd['hostname'] != ''
            hostname_list.push(evd['hostname'])
          end
          if !evd['lastexternalipaddress'].nil? && evd['lastexternalipaddress'] != ''
            lastexternalipaddress_list.push(evd['lastexternalipaddress'])
          end
          if !evd['onboardingstatus'].nil? && evd['onboardingstatus'] != ''
            onboardingstatus_list.push(evd['onboardingstatus'])
          end
          if !evd['devicednsname'].nil? && evd['devicednsname'] != ''
            devicednsname_list.push(evd['devicednsname'])
          end
          if !evd['rbacgroupname'].nil? && evd['rbacgroupname'] != ''
            rbacgroupname_list.push(evd['rbacgroupname'])
          end
          if !evd['dnsdomain'].nil? && evd['dnsdomain'] != ''
            dnsdomain_list.push(evd['dnsdomain'])
          end
          if !evd['version'].nil? && evd['version'] != ''
            osversion_list.push(evd['version'])
          end
        end
      end
      if event.get('[az][hoststates]').kind_of?(Array)
        event.get('[az][hoststates]').each do |hs|
          if !hs['riskscore'].nil? && hs['riskscore'] != ''
            log_riskscore_name.push(hs['riskscore'])
          end
          if !hs['fqdn'].nil? && hs['fqdn'] != ''
            host_hostname.push(hs['fqdn'])
          end
          if !hs['privateipaddress'].nil? && hs['privateipaddress'] != ''
            privateipaddress_list.push(hs['privateipaddress'])
          end
          if !hs['publicipaddress'].nil? && hs['publicipaddress'] != ''
            publicipaddress_list.push(hs['publicipaddress'])
          end
          if !hs['os'].nil? && hs['os'] != ''
            os_list.push(hs['os'])
          end
        end
      end
      if event.get('[az][filestates]').kind_of?(Array)
        event.get('[az][filestates]').each do |fs|
          if fs['filehash']['hashtype'] == 'sha256' && !fs['filehash']['hashvalue'].nil? && fs['filehash']['hashvalue'] != ''
            filehashes_sha256_list.push(fs['filehash']['hashvalue'])
          end
          if fs['filehash']['hashtype'] == 'sha1' && !fs['filehash']['hashvalue'].nil? && fs['filehash']['hashvalue'] != ''
            filehashes_sha1_list.push(fs['filehash']['hashvalue'])
          end
          if fs['filehash']['hashtype'] == 'md5' && !fs['filehash']['hashvalue'].nil? && fs['filehash']['hashvalue'] != ''
            filehashes_md5_list.push(fs['filehash']['hashvalue'])
          end
          if fs['name'] != '' && !fs['name'].nil?
            file_name.push(fs['name'])
          end
          if fs['path'] != '' && !fs['path'].nil?
            file_path.push(fs['path'])
          end
        end
      end

      if event.get('[az][entities]').kind_of?(Array)
        event.get('[az][entities]').each do |item|
          if item['filehashes'].kind_of?(Array)
            item['filehashes'].each do |fh|
              if fh['algorithm'] == 'sha256' && !fh['value'].nil? && fh['value'] != ''
                filehashes_sha256_list.push(fh['value'])
              end
              if fh['algorithm'] == 'sha1' && !fh['value'].nil? && fh['value'] != ''
                filehashes_sha1_list.push(fh['value'])
              end
              if fh['algorithm'] == 'md5' && !fh['value'].nil? && fh['value'] != ''
                filehashes_md5_list.push(fh['value'])
              end
            end
          end

          if item['loggedonusers'].kind_of?(Array)
            item['loggedonusers'].each do |lu|
              if !lu['accountname'].nil? && lu['accountname'] != ''
                loggedonusers_list.push(lu['accountname'])
              end
            end
          end 

          if item['tags'].kind_of?(Array)
            item['tags'].each do |itag|
              if itag.kind_of?(Hash)
                itag.each do |k, v|
                  tags_list.push(k + ':' + v)
                end
              end
            end
          end
		  
          if item['name'] != '' && !item['name'].nil?
            if item['type'] == 'file'
              file_name.push(item['name'])
              file_directory.push(item['directory'])
            end
          end

          if item['lastexternalipaddress'] != '' && !item['lastexternalipaddress'].nil?
            lastexternalipaddress_list.push(item['lastexternalipaddress'])
          end
          if item['osfamily'] != '' && !item['osfamily'].nil?
            osfamily_list.push(item['osfamily'])
          end
          if item['avstatus'] != '' && !item['avstatus'].nil?
            avstatus_list.push(item['avstatus'])
          end
          if item['osversion'] != '' && !item['osversion'].nil?
            osversion_list.push(item['osversion'])
          end

          if item['lastipaddress'] != '' && !item['lastipaddress'].nil?
            lastipaddress_list.push(item['lastipaddress'])
          end
          if item['riskscore'] != '' && !item['riskscore'].nil?
            riskscore_list.push(item['riskscore'])
          end
          if item['healthstatus'] != '' && !item['healthstatus'].nil?
            healthstatus_list.push(item['healthstatus'])
          end
        end
      end
      if !filehashes_sha256_list.empty?
        event.set('[file][hash][sha256]', filehashes_sha256_list)
      end
      if !filehashes_sha1_list.empty?
        event.set('[file][hash][sha1]', filehashes_sha1_list)
      end
      if !filehashes_md5_list.empty?
        event.set('[file][hash][md5]', filehashes_md5_list)
      end	  

      if !log_riskscore_name.empty?
        event.set('[log][syslog][severity][name]', log_riskscore_name)
      end
      if !host_hostname.empty?
        event.set('[host][hostname]', host_hostname)
      end
      if !privateipaddress_list.empty?
        event.set('[source][ip]', privateipaddress_list)
      end
      if !publicipaddress_list.empty?
        event.set('[source][nat][ip]', publicipaddress_list)
      end
      if !os_list.empty?
        event.set('[host][os][full]', os_list)
      end
      if !file_directory.empty?
        event.set('[file][path]', file_directory)
      end	  
      if !file_name.empty?
        event.set('[file][name]', file_name)
      end
      if !file_path.empty?
        event.set('[file][path]', file_path)
      end
      if !loggedonusers_list.empty?
        event.set('[user][name]', loggedonusers_list)
      end
      if !lastexternalipaddress_list.empty?
        event.set('[source][nat][ip]', lastexternalipaddress_list)
      end
      if !osfamily_list.empty?
        event.set('[host][os][family]', osfamily_list)
      end
      if !avstatus_list.empty?
        event.set('[event][code]', avstatus_list)
      end
      if !osversion_list.empty?
        event.set('[host][os][version]', osversion_list)
      end
      if !verdict_list.empty?
         event.set('[rule][id]', verdict_list)
      end

      if !usr_userprincipalname_list.empty?
        event.set('[user][email]', usr_userprincipalname_list)
      end  
      if !usr_domainname_list.empty?
        event.set('[user][domain]', usr_domainname_list)
      end  
      if !usr_accountname_list.empty?
        event.set('[user][name]', usr_accountname_list)
      end  
      if !usr_usersid_list.empty?
        event.set('[user][id]', usr_usersid_list)
      end  
      if !usr_roles_list.empty?
        event.set('[user][roles]', usr_roles_list)
      end  
      if !usr_useragent_list.empty?
        event.set('[user_agent][os][full]', usr_useragent_list)
      end  
      if !detailedroles_list.empty?
        event.set('[user][effective][roles]', detailedroles_list)
      end  
      if !protocol_list.empty?
        event.set('[network][protocol]', protocol_list)
      end  
      if !operatingsystem_list.empty?
        event.set('[host][os][name]', operatingsystem_list)
      end  
      if !ipaddress_list.empty?
        event.set('[source][ip]', ipaddress_list)
      end  
      if !countrylettercode_list.empty?
        event.set('[host][geo][country_iso_code]', countrylettercode_list)
      end

      if !hostname_list.empty?
        event.set('[host][hostname]', hostname_list)
      end
      if !onboardingstatus_list.empty?
        event.set('[host][type]', onboardingstatus_list)
      end
      if !devicednsname_list.empty?
        event.set('[host][name]', devicednsname_list)
      end
      if !rbacgroupname_list.empty?
        event.set('[user][group][name]', rbacgroupname_list)
      end
      if !dnsdomain_list.empty?
        event.set('[host][domain]', dnsdomain_list)
      end
      if !geo_city_list.empty?
        event.set('[host][geo][city_name]', geo_city_list)
      end  
      if !geo_state_list.empty?
        event.set('[host][geo][region_name]', geo_state_list)
      end
      if !geo_lat_list.empty?
        event.set('[tmp][latitude]', geo_lat_list)
      end
      if !geo_long_list.empty?
        event.set('[tmp][longitude]', geo_long_list)
      end
      if !tags_list.empty?
        ntl = event.get('[tags]')
        if ntl.nil?
          event.set('[tags]', tags_list)
        else
          event.set('[tags]', ntl + tags_list)
        end
      end
      if !lastipaddress_list.empty?
        event.set('[host][ip]', lastipaddress_list)
      end
      if !riskscore_list.empty?
        event.set('[event][severity]', riskscore_list)
      end
      if !healthstatus_list.empty?
        event.set('[host][type]', healthstatus_list)
      end
    "
    tag_on_exception => "_entities_ruby_block"
  }

  ruby {
    code => "
      file_path_list = []

      if event.get('[az][filestates]').kind_of?(Array)
        event.get('[az][filestates]').each do |item|
          if item['path'] != ''
            file_path_list.push(item['path'])
          end
        end
      end

      if !file_path_list.empty?
        event.set('[file][path]', file_path_list)
      end
    "
    tag_on_exception => "ruby_block_exception"
  }
  if [user][domain] == "" or [user][domain][0] == "" {
    mutate {
     remove_field => ["[user][domain]" ]
    }
  }

  if [user][effective][roles][0] {
    ruby {
      code => 'event.set("[user][effective][roles]", event.get("[user][effective][roles]").uniq)'
      tag_on_exception => "_rr_ruby_block"
    }
  }  
  if [user][roles][0] {
    ruby {
      code => 'event.set("[user][roles]", event.get("[user][roles]").uniq)'
      tag_on_exception => "_rr_ruby_block"
    }
  }
  if [user][full_name][0] {
    ruby {
      code => 'event.set("[user][full_name]", event.get("[user][full_name]").uniq)'
