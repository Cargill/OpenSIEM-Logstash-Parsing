      "[az][evidence][0][useraccount][domainname]" => "[user][domain]"
      "[az][evidence][1][p1sender][emailaddress]" => "[source][user][email]"
      "[az][evidence][1][subject]" => "[email][subject]"
      "[az][evidence][1][recipientemailaddress]" => "[destination][user][email]"
      
    }
  }
  if ![rule][name] {
    mutate {
      rename => {
       "[az][additionaldata][alertpolicytitle]" => "[rule][name]"
      }
    }
  }
  if [rule][category] == "malware" {
    mutate {
     remove_field => [ "[event][outcome]" ]
    }  
  }

  if [az][azuretenantid] and [az][azuretenantid] != "" {
    mutate { 
      add_field => { "[log][source][hostname]" => "%{[az][azuretenantid]}"}
    }
  } else if [az][tenantid] and [az][tenantid]  != "" {
    mutate { 
	  add_field => { "[log][source][hostname]" => "%{[az][tenantid]}"}
    }
  }
  ruby {
    code => "
      usr_displayname_list = []
      if event.get('[az][evidence]').kind_of?(Array)
        event.get('[az][evidence]').each do |evd|
          if !evd['useraccount']['displayname'].nil? && evd['useraccount']['displayname'] != ''
            usr_displayname_list.push(evd['useraccount']['displayname'])
            event.set('[user][full_name]', usr_displayname_list)
          end 
        end
      end
    "
    tag_on_exception => ""
    
  }
  ruby {
    code => "
