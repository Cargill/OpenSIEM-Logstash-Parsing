      "[az][evidence][1][filedetails][sha256]" => "[file][hash][sha256]"
      "[az][evidence][1][filedetails][filename]" => "[file][name]"
      "[az][evidence][1][filedetails][filepath]" => "[file][path]"
      "[az][evidence][1][filedetails][filesize]" => "[file][size]"
