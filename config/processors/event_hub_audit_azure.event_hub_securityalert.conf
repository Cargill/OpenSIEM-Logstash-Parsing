input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate{  
    remove_field => [ "host", "event", "file" ]   
      gsub => [
          "message", "'", ""
      ]
  }
  mutate{  
  }  
  if [message] =~ '^{"records": \[' {
    json {
      source => "message"
      target => "tmp"
      skip_on_invalid_json => true
    }
    split {
      field => "[tmp][records]"
      target => "az"
    }
    mutate {
      replace => { "message" => "%{az}" }
    }
  } else {
    json {
      source => "message"
      target => "az"
      skip_on_invalid_json => true
    }
  }
  # lowercase field names
  ruby {
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  json {
    source => "[az][entities]"
    target => "[az][entities]"
    skip_on_invalid_json => true
  }
  json {
    source => "[az][extendedproperties]"
    target => "[az][extendedproperties]"
    skip_on_invalid_json => true
  }
  json {
    source => "[az][remediationsteps]"
    target => "[az][remediationsteps]"
    skip_on_invalid_json => true
  }   
  mutate {
    add_field => { 
      "[event][module]" => "azure"
      "[event][dataset]" => "azure.securityalert"
    }
  }
  if [az][tenantid] {
    mutate {
      add_field => { 
        "[log][source][hostname]" => "%{[az][tenantid]}" 
      }
    }
  } else {
    mutate {
      add_field => { 
        "[log][source][hostname]" => "azure.securityalert" 
      }
    }
  }
  mutate {
    rename => { 
      "[az][alertname]" => "[rule][name]"
      "[az][alertseverity]" => "[event][severity_name]"
      "[az][alerttype]" => "[rule][category]"
      "[az][description]" => "[rule][description]"
      "[az][endtime]" => "[event][end]"
      "[az][providername]" => "[event][provider]"
      "[az][starttime]" => "[event][start]"
      "[az][status]" => "[event][outcome]"
      "[az][systemalertid]" => "[event][id]"
      "[az][tactics]" => "[threat][tactic][name]"
      "[az][techniques]" => "[threat][technique][name]"
      "[az][tenantid]" => "[rule][id]"
      "[az][timegenerated]" => "[event][ingested]"
      "[az][vendorname]" => "[observer][vendor]"
      "[az][type]" => "[event][type]"
      "[az][productname]" => "[service][type]"
      "[az][alertlink]" => "[event][reference]"
      "[az][remediationsteps]" => "[vulnerability][description]"
      "[az][extendedproperties][alerturi]" => "[rule][reference]"
      "[az][extendedproperties][category]" => "[event][category]"
      "[az][extendedproperties][originsource]" => "[rule][ruleset]"
      "[az][resourceid]" => "[cloud][instance][name]"
      "[az][_internal_workspaceresourceid]" => "[cloud][project][id]"
      "[az][extendedproperties][client ip address]" => "[host][ip]"
      "[az][extendedproperties][ip addresses]" => "[source][ip]"
      "[az][extendedproperties][user agent]" => "[user_agent][name]"
      "[az][extendedproperties][command line]" => "[process][name]"
      "[az][extendedproperties][process name]" => "[process][executable]"
      "[az][displayname]" => "[user][name]" 
      "[az][extendedproperties][domainname]" => "[host][hostname]"

      "[az][extendedproperties][threatname]" => "[threat][technique][name]"
      "[az][extendedproperties][threatfamilyname]" => "[threat][list][type]"
      "[az][extendedproperties][alert generation status]" => "[event][action]"
      "[az][extendedproperties][microsoftdefenderatp.category]" => "[rule][category]"
      "[az][extendedproperties][action]" => "[threat][technique][reference]"
      "[az][extendedproperties][microsoftdefenderatp.investigationstate]" => "[event][outcome]"
      "[az][extendedproperties][microsoftdefenderatp.investigationid]" => "[trace][id]"

    }
  }
  if [rule][category] == "malware" {
    mutate {
      remove_field => [ "[user][name]" ]
    }
  }
  if [source][ip] == "" {
    mutate {
      remove_field => [ "[source][ip]" ]
    }
  }
  mutate {
     lowercase => [ "[rule][name]" ]
  } 
  ruby {
    code => "
      netbiosname_list = []
      address_list = []
      ntdomain_list = []
      displayname_list = []
      type_list = []
      osfamily_list = []
      dnsdomain_list = []
      lastipaddress_list = []
      useragent_list = []
      hostname_list = []
      urls_list = []
      userprincipalname_list = []
      senderip_list = []
      p2sender_list = []
      subject_list = []
      mailboxprimaryaddress_list = []
      sid_list = []
      upnsuffix_list = []
      accountname_list = []
      address_list = []
      deliveryaction_list = []
      filehashes_sha256_list = []
      filehashes_sha1_list = []
      networkmessageids_list = []
      name_type_file_list = []
      name_type_cloud_app_proc_list = []
      name_type_cloud_app_instance_list = []
      name_type_user_userprincipalname_list = []
      name_type_user_accountname_list = []
      name_type_user_domainname_list = []
      name_type_user_sid_list = []
      name_type_url_url_list = []
      lastipaddress_type_host_list = []
      lastexternalipaddress_list = []
      loggedonusers_list = []
	  tags_list = []
	  avstatus_list = []
	  osversion_list = []
	  riskscore_list = []
	  healthstatus_list = []
	  fqdn_list = []
      if event.get('[az][entities]').kind_of?(Array)
        event.get('[az][entities]').each do |item|
          if item['filehashes'].kind_of?(Array)
            item['filehashes'].each do |fh|
              if fh['algorithm'] == 'sha256' && !fh['value'].nil? && fh['value'] != ''
                filehashes_sha256_list.push(fh['value'])
              end
              if fh['algorithm'] == 'sha1' && !fh['value'].nil? && fh['value'] != ''
                filehashes_sha1_list.push(fh['value'])
              end
            end
          end
          

          if item['loggedonusers'].kind_of?(Array)
            item['loggedonusers'].each do |lu|
              if !lu['accountname'].nil? && lu['accountname'] != ''
                loggedonusers_list.push(lu['accountname'])
              end
            end
          end 
          if item['tags'].kind_of?(Array)
            item['tags'].each do |itag|
              if itag.kind_of?(Hash)
                itag.each do |k, v|
                  tags_list.push(k + ':' + v)
                end
              end
            end
          end
          if item['healthstatus'] != '' && !item['healthstatus'].nil?
            healthstatus_list.push(item['healthstatus'])
          end
          if item['fqdn'] != '' && !item['fqdn'].nil?
            fqdn_list.push(item['fqdn'])
          end

          if item['osversion'] != '' && !item['osversion'].nil?
            osversion_list.push(item['osversion'])
          end	  
          if item['riskscore'] != '' && !item['riskscore'].nil?
            riskscore_list.push(item['riskscore'])
          end

          if item['lastipaddress'] != '' && !item['lastipaddress'].nil?
            lastipaddress_type_host_list.push(item['lastipaddress'])
          end
          if item['lastexternalipaddress'] != '' && !item['lastexternalipaddress'].nil?
            lastexternalipaddress_list.push(item['lastexternalipaddress'])
          end
          if item['name'] != '' && !item['name'].nil?
            if item['type'] == 'file'
              name_type_file_list.push(item['name'])
            end
            if item['type'] == 'cloud-application'
              name_type_cloud_app_proc_list.push(item['name'])
              name_type_cloud_app_instance_list.push(item['instancename'])
            end
            if item['type'] == 'account'
              name_type_user_userprincipalname_list.push(item['name'])
              name_type_user_accountname_list.push(item['instancename'])
              name_type_user_domainname_list.push(item['instancename'])
              name_type_user_sid_list.push(item['instancename'])
            end
          end
          if item['avstatus'] != '' && !item['avstatus'].nil?
            avstatus_list.push(item['avstatus'])
          end
          if item['type'] == 'url'
            name_type_url_url_list.push(item['url'])
          end
          if item['networkmessageids_list'] != '' && !item['networkmessageids_list'].nil?
            networkmessageids_list.push(item['networkmessageids_list'])
          end
          if item['deliveryaction'] != '' && !item['deliveryaction'].nil?
            deliveryaction_list.push(item['deliveryaction'])
          end
          if item['displayname'] != '' && !item['displayname'].nil?
            displayname_list.push(item['displayname'])
          end
          if item['ntdomain'] != '' && !item['ntdomain'].nil?
            ntdomain_list.push(item['ntdomain'])
          end
          if item['netbiosname'] != '' && !item['netbiosname'].nil?
            netbiosname_list.push(item['netbiosname'])
          end
          if item['address'] != '' && !item['address'].nil?
            address_list.push(item['address'])
          end
          if item['type'] != '' && !item['type'].nil?
            type_list.push(item['type'])
          end
          if item['osfamily'] != '' && !item['osfamily'].nil?
            osfamily_list.push(item['osfamily'])
          end
          if item['hostname'] != '' && !item['hostname'].nil?
            hostname_list.push(item['hostname'])
          end
          if item['urls'] != '' && !item['urls'].nil?
            urls_list.push(item['urls'])
          end
          if item['useragent'] != '' && !item['useragent'].nil?
            useragent_list.push(item['useragent'])
          end
          if item['[lastipaddress][address]'] != '' && !item['[lastipaddress][address]'].nil?
            lastipaddress_list.push(item['[lastipaddress][address]'])
          end
          if item['dnsdomain'] != '' && !item['dnsdomain'].nil?
            dnsdomain_list.push(item['dnsdomain'])
          end
          if item['subject'] != '' && !item['subject'].nil?
            subject_list.push(item['subject'])
          end
          if item['mailboxprimaryaddress'] != '' && !item['mailboxprimaryaddress'].nil?
            mailboxprimaryaddress_list.push(item['mailboxprimaryaddress'])
          end
          if item['sid'] != '' && !item['sid'].nil?
            sid_list.push(item['sid'])
          end
          if item['upnsuffix'] != '' && !item['upnsuffix'].nil?
            upnsuffix_list.push(item['upnsuffix'])
          end
          if item['accountname'] != '' && !item['accountname'].nil?
            accountname_list.push(item['accountname'])
          end
          if item['address'] != '' && !item['address'].nil?
            address_list.push(item['address'])
          end
        end
      end
      if !lastipaddress_type_host_list.empty?
        event.set('[source][ip]', lastipaddress_type_host_list)
      end
      if !lastexternalipaddress_list.empty?
        event.set('[source][nat][ip]', lastexternalipaddress_list)
      end
      if !name_type_url_url_list.empty?
        event.set('[url][full]', name_type_url_url_list)
      end
      if !name_type_user_userprincipalname_list.empty?
        event.set('[user][email]', name_type_user_userprincipalname_list)
      end
      if !name_type_user_accountname_list.empty?
        event.set('[user][name]', name_type_user_accountname_list)
      end
      if !name_type_user_domainname_list.empty?
        event.set('[user][name][domain]', name_type_user_domainname_list)
      end
      if !name_type_user_sid_list.empty?
        event.set('[user][id]', name_type_user_sid_list)
      end
      if !name_type_file_list.empty?
        event.set('[file][name]', name_type_file_list)
      end
      if !name_type_cloud_app_proc_list.empty?
        event.set('[process][name]', name_type_cloud_app_proc_list)
      end 
      if !name_type_cloud_app_instance_list.empty?
        event.set('[cloud][instance][name]', name_type_cloud_app_instance_list)
      end 
      if !networkmessageids_list.empty?
        event.set('[file][uid]', networkmessageids_list)
      end
      if !deliveryaction_list.empty?
        event.set('[event][action]', deliveryaction_list)
      end
      if !displayname_list.empty?
        event.set('[user][email]', displayname_list)
      end
      if !ntdomain_list.empty?
        event.set('[user][domain]', ntdomain_list)
      end
      if !filehashes_sha256_list.empty?
        event.set('[file][hash][sha256]', filehashes_sha256_list)
      end
      if !filehashes_sha1_list.empty?
        event.set('[file][hash][sha1]', filehashes_sha1_list)
      end
      if !netbiosname_list.empty?
        event.set('[host][hostname]', netbiosname_list)
      end
      if !address_list.empty?
        event.set('[host][ip]', address_list)
      end
      if !type_list.empty?
        event.set('[error][type]', type_list)
      end
      if !osfamily_list.empty?
        event.set('[host][os][family]', osfamily_list)
      end
      if !hostname_list.empty?
        event.set('[source][address]', hostname_list)
      end
      if !urls_list.empty?
        event.set('[url][tmp]', urls_list)
      end
      if !useragent_list.empty?
        event.set('[user_agent][name]', useragent_list)
      end  
      if !lastipaddress_list.empty?
        event.set('[source][ip]', lastipaddress_list)
      end  
      if !dnsdomain_list.empty?
        event.set('[host][domain]', dnsdomain_list)
      end
      if !senderip_list.empty?
        event.set('[source][ip]', senderip_list)
      end
      if !p2sender_list.empty?
        event.set('[source][user][email]', p2sender_list)
      end
      if !subject_list.empty?
        event.set('[email][subject]', subject_list)
      end
      if !mailboxprimaryaddress_list.empty?
        event.set('[user][email]', mailboxprimaryaddress_list)
      end
      if !sid_list.empty?
        event.set('[user][id]', sid_list)
      end
      if !upnsuffix_list.empty?
        event.set('[user][domain]', upnsuffix_list)
      end
      if !accountname_list.empty?
        event.set('[user][name]', accountname_list)
      end
      if !address_list.empty?
        event.set('[source][ip]', address_list)
      end
      if !loggedonusers_list.empty?
        event.set('[user][name]', loggedonusers_list)
      end
      if !avstatus_list.empty?
        event.set('[event][code]', avstatus_list)
      end
      if !osversion_list.empty?
        event.set('[host][os][version]', osversion_list)
      end
      if !riskscore_list.empty?
        event.set('[event][severity]', riskscore_list)
      end
      if !healthstatus_list.empty?
        event.set('[host][type]', healthstatus_list)
      end
      if !fqdn_list.empty?
        event.set('[host][hostname]', fqdn_list)
      end
      if !tags_list.empty?
        ntl = event.get('[tags]')
        if ntl.nil?
          event.set('[tags]', tags_list)
        else
          event.set('[tags]', ntl + tags_list)
        end
      end

    "
    tag_on_exception => "_entities_ruby_block"
  }
  if [source][ip] {
    ruby {
      code => 'event.set("[source][ip]", event.get("[source][ip]").uniq)'
      tag_on_exception => "_sip_ruby_block"
    }
  }
  if [host][ip] {
    ruby {
      code => 'event.set("[host][ip]", event.get("[host][ip]").uniq)'
      tag_on_exception => "_hip_ruby_block"
    }
  }
  if [error][type] {
    ruby {
      code => 'event.set("[error][type]", event.get("[error][type]").uniq)'
      tag_on_exception => "_etype_ruby_block"
    } 
  }
  if [user][domain] {
    ruby {
      code => 'event.set("[user][domain]", event.get("[user][domain]").uniq)'
      tag_on_exception => "_ud_ruby_block"
    }
  }
  if [host][hostname] {
    ruby {
      code => 'event.set("[host][hostname]", event.get("[host][hostname]").uniq)'
      tag_on_exception => "_hn_ruby_block"
    }
  }
  if [rule][name] == "security event log cleared" or [rule][name] == "possible data exfiltration via dns tunnel"{
    mutate {
      remove_field => [ "[user]" ]
    }
  }
  if [url][tmp] {
    mutate {
      join => { "[url][tmp]" => "," }
    }
    mutate {
      rename => { "[url][tmp]" => "[url][full]" }
    }
    mutate {
      split => { "[url][full]" => "," }
    }
  }

  mutate {
    remove_field => [ "tmp", "az" ]
  }
  date {
    match => [ "[event][ingested]" , "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][ingested]"
    tag_on_failure => "_dateparsefailure_ei"
  }
  date {
    match => [ "[event][start]" , "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][start]"
    tag_on_failure => "_dateparsefailure_es"
  }
  date {
    match => [ "[event][end]" , "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][end]"
    tag_on_failure => "_dateparsefailure_ee"
  }
}
output {
  pipeline { send_to => [enrichments] }
}
