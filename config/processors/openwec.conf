input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "event", "host" ]
  }
  mutate {
    add_field => {
      "[event][module]" => "windows_wef"
      "[event][dataset]" => "windows_wef_events"
      "[agent][name]" => "openwec"
      "[agent][type]" => "openwec"
    }
  }
  json {
    source => "message"
    target => "tmp"
  }

  mutate {
    gsub => [
      "[tmp][UserData]", "(^.*?) .*?(>.*?$)", "\1\2"
    ]
  }
  xml {
    source => "[tmp][UserData]"
	target => "[tmp][xml]"
  }
# lowercase field names
  ruby {
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  mutate {
    rename => {
      "[tmp][xml][subjectdomainname]" => "[user][domain]"
      "[tmp][xml][subjectusername]" => "[user][name]"
      "[tmp][xml][subjectusersid]" => "[user][id]"
    }
  }

  mutate {
    rename => {
      "[tmp][openwec][ipaddress]" => "[log][source][ip]"
      "[tmp][system][computer]" => "[log][source][hostname]"
      "[tmp][system][eventid]" => "[event][id]"
      "[tmp][system][user][domain]" => "[user][domain]"
      "[tmp][system][user][name]" => "user_name"
      "[tmp][system][channel]" => "[event][kind]"
      "[tmp][eventdata][targetlogonguid]" => "[destination][user][group][id]"
      "[tmp][eventdata][targetdomainname]" => "[destination][domain]"
      "[tmp][eventdata][targetoutboundusername]" => "destinationuser_name"
      "[tmp][eventdata][targetusername]" => "hostuser_name"
      "[tmp][eventdata][data][targetusername]" => "hostuser_name"
      "[tmp][eventdata][clientip]" => "client_ip"
      "[tmp][system][user_data][subjectusername]" => "sourceuser_name"
      "[tmp][eventdata][subjectusername]" => "sourceuser_name"
      "[tmp][system][user_data][subjectusersid]" => "sourceuser_id"
      "[tmp][eventdata][subjectusersid]" => "sourceuser_id"
	  "[tmp][eventdata][destaddress]" => "[destination][ip]"
      "[tmp][eventdata][group]"  => "[destination][user][group][name]"
      "[tmp][eventdata][destport]" => "[destination][port]"
      "[tmp][eventdata][clientname]" => "[client][user][name]"
      "[tmp][eventdata][clientaddress]" => "[client][ip]"
      "[tmp][eventdata][originalfilename]" => "[file][path]"
      "[tmp][eventdata][path]" => "[file][path]"
      "[tmp][eventdata][sharelocalpath]" => "[file][target_path]"
      "[tmp][eventdata][sharename]" => "[file][sharename]"
      "[tmp][eventdata][newsd]" => "[file][new_acl]"
      "[tmp][eventdata][oldsd]" => "[file][old_acl]"
      "[tmp][eventdata][objectname]" => "[file][path]"
      "[tmp][eventdata][servicefilename]" => "[file][path]"
      "[tmp][eventdata][taskname]" => "[process][name]"
      "[tmp][system][user_data][processid]" => "[process][pid]"
      "[tmp][system][process][pid]" => "[process][pid]"
      "[tmp][system][execution][processid]" => "[process][pid]"
      "[tmp][eventdata][newprocessname]" => "[process][name]"
      "[tmp][eventdata][servicename]" => "[service][name]"
      "[tmp][eventdata][service]" => "[service][name]"
      "[tmp][eventdata][servicesid]" => "[process][pid]"
      "[tmp][eventdata][parentprocessname]" => "[process][parent][name]"
      "[tmp][eventdata][logonprocessname]" => "[process][name]"
      "[tmp][eventdata][application]" => "[process][name]"
      "[tmp][eventdata][objecttype]" => "[process][args]"
      "[tmp][eventdata][sourceprocessid]" => "[process][parent][pid]"
      "[tmp][eventdata][processid]" => "[process][pid]"
      "[tmp][eventdata][processpath]" => "[process][path]"
      "[tmp][eventdata][processpid]" => "[process][pid]"
      "[tmp][system][process][thread][id]" => "[process][thread][id]"
      "[tmp][system][execution][threadid]" => "[process][thread][id]"
      "[tmp][eventdata][commandline]" => "[process][command_line]" 
      "[tmp][eventdata][subjectdomainname]" => "[source][user][domain]"
      "[tmp][system][user_data][subjectdomainname]" => "[source][user][domain]"
      "[tmp][eventdata][accountname]" => "[source][user][id]"
      "[tmp][eventdata][accountdomain]" => "[source][user][domain]"
      "[tmp][eventdata][ipaddress]" => "[source][ip]"
      "[tmp][eventdata][ipport]" => "[source][port]"
      "[tmp][eventdata][sourceaddress]" => "[source][ip]"
      "[tmp][eventdata][sourceport]" => "[source][port]"
      "[tmp][eventdata][packagename]" => "[package][name]"
      "[tmp][eventdata][protocol]" => "[network][iana_number]"
      "[tmp][eventdata][logontype]" => "[rule][uuid]"
      "[tmp][eventdata][ruleid]" => "[rule][id]"
      "[tmp][eventdata][rulename]" => "[rule][name]"
      "[tmp][eventdata][conntype]" => "[network][transport]"
      "[tmp][eventdata][workstationname]" => "[destination][address]"
      "[tmp][system][event_id]" => "[event][id]"
      "[tmp][eventdata][status]" => "[event][code]"
      "[tmp][eventdata][targetlogonid]" => "[user][id]"
      "[tmp][eventdata][authenticationpackagename]" => "[package][name]"
      "[tmp][system][timecreated]" => "[event][created]"
      "[tmp][openwec][subscription][version]" => "[agent][version]"
      "[tmp][openwec][subscription][uuid]" => "[agent][id]"
      "[tmp][openwec][subscription][uri]" => "[agent][ephemeral_id]" 
      "[tmp][system][provider][name]" => "[event][provider]"
    }
    copy => { "[event][id]" => "[event][code]" }
  }

  if [event][id] == "7036" {  
    mutate {
      rename => {
        "[tmp][eventdata][param1]" => "[service][name]"
        "[tmp][eventdata][param2]" => "[service][state]"
      }
    }
  }
  if [event][id] == "1149" {  
    mutate {
      rename => { "[tmp][eventdata][param1]" => "[source][user][name]" }
      rename => { "[tmp][eventdata][param2]" => "[source][user][domain]" }
      rename => { "[tmp][eventdata][param2]" => "[source][ip]" }
    }
  }
  if [tmp][eventdata][processname] and [tmp][eventdata][processname] !~ "-" {
    mutate {
      add_field => { "[process][name]" => "%{[tmp][eventdata][processname]}" }
    }
  }

  if [event][id] == "33205" {
    # https://docs.logrhythm.com/devices/docs/evid-33205-sql-audit-event
    mutate {
      rename => {
       "[tmp][eventdata][param1][action_id]" => "[rule][id]"
       "[tmp][eventdata][param1][class_type]" => "[event][type]"
       "[tmp][eventdata][param1][server_instance_name]" => "[database][instance]"
       "[tmp][eventdata][param1][database_name]" => "[database][name]"
       "[tmp][eventdata][param1][schema_name]" => "[process][title]"
       "[tmp][eventdata][param1][object_name]" => "[process][args]"
       "[tmp][eventdata][param1][statement]" => "[process][command_line]"
       "[tmp][eventdata][param1][application_name]" => "[process][name]"
       "[tmp][eventdata][param1][data_sensitivity_information]" => "[cmdb][application][sensitivity]"
       "[tmp][eventdata][param1][database_principal_name]" => "[database][principal_name]"
       "[tmp][eventdata][param1][host_name]" => "[host][hostname]"   
      }
      replace => { "[event][created]" => "%{[eventdata][param1][event_time]}" }
    }
    mutate {
       lowercase => [ "[host][hostname]" ]
    }
    if [eventdata][param1][succeeded] {
      mutate {
        add_field => { "[event][outcome]" => "success" }
      }
    } else {
      mutate {
        add_field => { "[event][outcome]" => "failed" }
      }      
    }
    if [eventdata][param1][client_ip] {
      if [tmp][eventdata][param1][client_ip] =~ "\d+\.\d+\.\d+\.\d+" {
        mutate {
          rename => {
            "[tmp][eventdata][param1][client_ip]" => "[source][ip]"
          }
        }
      } else {
        mutate {
          rename => {
            "[tmp][eventdata][param1][client_ip]" => "[source][address]"
          }
        }
      }
    }
    grok {
      tag_on_failure => "_grokparsefailure_src_usr_name"
      match => { "[tmp][eventdata][param1][session_server_principal_name]" => "^((?<[source][user][domain]>.*?)\\)?(?<[source][user][name]>.*?)$" }
      timeout_millis => 500
    }
    grok {
      tag_on_failure => "_grokparsefailure_db_usr_name"
      match => { "[tmp][eventdata][param1][server_principal_name]" => "^((?<[database][user][domain]>.*?)\\)?(?<[database][user][name]>.*?)$" }
      timeout_millis => 500
    }
  }

  # spliting client ip and port
  if [client_ip] {
    if [client_ip] =~ ":" {
      dissect {
        mapping => {
          client_ip => "%{[[client][ip]]}:%{[[client][port]]}"
        }
      }
      mutate {remove_field => ["client_ip"]}
    }
    else {
      mutate {
        rename => {"client_ip" => "[client][ip]"}
      }
    }
  }
  # spliting user name and domain
  if [user_name] {
    if [user_name] =~ "@" {
      dissect {
        mapping => {
          user_name => "%{[[user][name]]}@%{[[user][domain]]}"
        }
      }
      mutate {remove_field => ["user_name"]}
    }
    else {
      mutate {
        rename => {"user_name" => "[user][name]"}
      }
    }
  }
  if [sourceuser_name] {
    if [sourceuser_name] =~ "@" {
      dissect {
        mapping => {
          sourceuser_name => "%{[[source][user][name]]}@%{[[source][user][domain]]}"
        }
      }
      mutate {remove_field => ["sourceuser_name"]}
    }
    else {
      mutate {
        rename => {"sourceuser_name" => "[source][user][name]"}
      }
    }
  }
  if [destinationuser_name] {
    if [destinationuser_name] =~ "@" {
      dissect {
        mapping => {
          destinationuser_name => "%{[[destination][user][name]]}@%{[[destination][user][domain]]}"
        }
      }
      mutate {remove_field => ["destinationuser_name"]}
    }
    else {
      mutate {
        rename => {"destinationuser_name" => "[destination][user][name]"}
      }
    }
  }
  if [sourceuser_id] {
    if [sourceuser_id] =~ "@" {
      dissect {
        mapping => {
          sourceuser_id => "%{[[source][user][id]]}@%{[[source][user][domain]]}"
        }
      }
      mutate {remove_field => ["sourceuser_id"]}
    } else {
      mutate {
        rename => {"sourceuser_id" => "[source][user][id]"}
      }
    }
  }
  if [hostuser_name] and [hostuser_name] != "None" {
    if [hostuser_name] =~ "@" {
      dissect {
        mapping => {
          hostuser_name => "%{[[host][user][name]]}@%{[[host][user][domain]]}"
        }
      }
      mutate {remove_field => ["hostuser_name"]}
    } else {
      mutate {
        rename => {"hostuser_name" => "[host][user][name]"}
      }
    }
  }
# what is this
 #  mutate {
 #   copy => { "message" => "tmp" }
 # }
  mutate {    
    gsub => [ "tmp", "\r", "" ]
    gsub => [ "tmp", "\n", "" ]
  }

  if [event][id] == "5829" {
    grok {
      tag_on_failure => "_grokparsefailure_1"
      match => { "tmp" => "^(?<[error][message]>.*?) Warning: (.*?please visit  (?<[event][reference]>.*?)\.\s+).*?Machine SamAccountName: (?<[observer][name]>.*?) .*?Domain: (?<[source][domain]>.*?\.) .*?Account Type:" }
      timeout_millis => 500
    }
  }
  if [event][id] == "411" {
    grok {
      tag_on_failure => "_grokparsefailure_2"
      match => { "tmp" => "^(?<[event][action]>.*?) Additional Data(.*?) Token Type: (?<[event][url]>.*?)(\s)?  Client IP: (?<[client][ip]>.*?) Error message: (?<[error][message]>.*?) Exception details: (?<[error][type]>.*?):(.*)" }
      timeout_millis => 500
    }
  }

  if [event][id] == "4769" {  
    mutate {
      rename => { "[tmp][eventdata][ticketoptions]" => "ticket_option" }
      rename => { "[tmp][eventdata][ticketencryptiontype]" => "ticket_encrypt" }
      gsub => [ "tmp", "\t", "" ]
    }
    grok {
      tag_on_failure => "_grokparsefailure_3"
      match => { "tmp" => "^.*Failure Code:(?<failure_code>.*)Transited Services.*$" }
      timeout_millis => 500
    }
	
    translate {
      source => "failure_code"
      target => "[event][reason]"
      dictionary => {
        "0x0" => "No errors were found"
        "0x1" => "Client's entry in database has expired"
        "0x2" => "Server's entry in database has expired"
        "0x3" => "Requested protocol version # not supported"
        "0x4" => "Client's key encrypted in old master key"
        "0x5" => "Server's key encrypted in old master key"
        "0x6" => "Client not found in Kerberos database"
        "0x7" => "Server not found in Kerberos database"
        "0x8" => "Multiple principal entries in database"
        "0x9" => "The client or server has a null key"
        "0x10" => "KDC has no support for padata type"
        "0x11" => "KDC has no support for transited type"
        "0x12" => "Clients credentials have been revoked"
        "0x13" => "Credentials for server have been revoked"
        "0x14" => "TGT has been revoked"
        "0x15" => "Client not yet valid - try again later"
        "0x16" => "Server not yet valid - try again later"
        "0x17" => "Password has expired"
        "0x18" => "Pre-authentication information was invalid"
        "0x19" => "Additional pre-authentication required"
        "0x20" => "Ticket expired"
        "0x21" => "Ticket not yet valid"
        "0x22" => "Request is a replay"
        "0x23" => "The ticket isn't for us"
        "0x24" => "Ticket and authenticator don't match"
        "0x25" => "Clock skew too great"
        "0x26" => "Incorrect net address"
        "0x27" => "Protocol version mismatch"
        "0x28" => "Invalid msg type"
        "0x29" => "Message stream modified"
        "0x30" => "Alternative authentication method required*"
        "0x31" => "Incorrect sequence number in message"
        "0x32" => "Inappropriate type of checksum in message"
        "0xA" => "Ticket not eligible for postdating"
        "0xB" => "Requested start time is later than end time"
        "0xC" => "KDC policy rejects request"
        "0xD" => "KDC cannot accommodate requested option"
        "0xE" => "KDC has no support for encryption type"
        "0xF" => "KDC has no support for checksum type"
        "0x1F" => "Integrity check on decrypted field failed"
        "0x2A" => "Message out of order"
        "0x2C" => "Specified version of key is not available"
        "0x2D" => "Service key not available"
        "0x2E" => "Mutual authentication failed"
        "0x2F" => "Incorrect message direction"
        "0x3C" => "Generic error (description in e-text)"
        "0x3D" => "Field is too long for this implementation"
      }
      fallback => "failed service ticket request"
    }
    translate {
      source => "ticket_encrypt"
      target => "[tls][cipher]"
      dictionary => {
        "0x1" => "DES-CBC-CRC"
        "0x3" => "DES-CBC-MD5"
        "0x11" => "AES128-CTS-HMAC-SHA1-96"
        "0x12" => "AES256-CTS-HMAC-SHA1-96"
        "0x17" => "RC4-HMAC"
        "0x18" => "RC4-HMAC-EXP"
      }
        fallback => "Audit Failures"
    }
    if [ticket_option] {
      ruby {
        code => "
            # decimal representations for the 32 bit binaries with check bit set
            # https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4769
            hash = {
              1073741824 => 'Forwardable',
              536870912 => 'Forwarded',
              268435456 => 'Proxiable',
              134217728 => 'Proxy',
              67108864 => 'Allow-postdate',
              33554432 => 'Postdated',
              16777216 => 'Invalid',
              8388608 => 'Renewable',
              4194304 => 'Initial',
              2097152 => 'Pre-authent',
              1048576 => 'Opt-hardware-auth',
              524288 => 'Transited-policy-checked',
              262144 => 'Ok-as-delegate',
              131072 => 'Request-anonymous',
              65536 => 'Name-canonicalize',
              32 => 'Disable-transited-check',
              16 => 'Renewable-ok',
              8 => 'Enc-tkt-in-skey',
              4 => 'Unused',
              2 => 'Renew',
              1 => 'Validate'
            }
            hexNum = event.get('ticket_option')
            num = hexNum.to_i(16)
            values_array = []
            hash.each do |bit_flag, flag_value|
              # bitwise multiplication on binary representation
              result = num & bit_flag
              if result == bit_flag
                values_array.append(flag_value)
              end
            end
            event.set('[service][type]', values_array)
        "
      }
    }
  }

  if [source][ip] {
    if [source][ip] =~ "::ffff:" {
      mutate {
        gsub => ["[source][ip]","::ffff:",""]
      }
    }
  }
  if [destination][ip] {
    if [destination][ip] =~ "::ffff:" {
      mutate {
        gsub => ["[destination][ip]","::ffff:",""]
      }
    }
  }
    # https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4688
  mutate {
    lowercase => [ "[tmp][eventdata][mandatorylabel]" ]
  }
  translate {
    source => "[tmp][eventdata][mandatorylabel]"
    target => "[event][reason]"
    dictionary => {
      "s-1-16-0" => "untrusted"
      "s-1-16-4096" => "low integrity"
      "s-1-16-8192" => "medium integrity"
      "s-1-16-8448" => "medium high integrity"
      "s-1-16-12288" => "high integrity"
      "s-1-16-16384" => "system integrity"
      "s-1-16-20480" => "protected process"
    }
      fallback => "none"
  }
  translate {
    source => "[tmp][system][level]"
    target => "[log][level]"
    dictionary => {
      "0" => "information"
      "1" => "start"
      "2" => "stop"
      "3" => "datacollectionstart"
      "4" => "datacollectionstop"
      "5" => "extension"
      "6" => "reply"
      "7" => "resume"
      "8" => "suspend"
      "9" => "send"
      "240" => "receive"
    }
      fallback => "none"
  }
  translate {
    source => "[tmp][system][keywords]"
    target => "[rule][category]"
    dictionary => {
      "0x8010000000000000" => "audit failure"
      "0x8020000000000000" => "audit success"
    }
      fallback => "none"
  }
  translate {
    source => "[tmp][system][task]"
    target => "[event][action]"
    dictionary => {
      "12288" => "security state change"
      "12544" => "logon"
      "12548" => "special logon"
      "12800" => "object access"
      "12801" => "object modification"
      "12804" => "scheduled task creation"
      "13056" => "account management"
      "13057" => "group membership change"
      "13058" => "group creation/deletion"
      "13059" => "group modification"
      "13060" => "domain policy change"
      "13061" => "account lockout"
      "13062" => "computer account management"
      "13312" => "process creation"
      "13313" => "process termination"
      "13400" => "scheduled task management"
      "13568" => "user rights assignment"
      "13600" => "audit policy change"
      "13700" => "kerberos policy change"
      "13701" => "efs policy change"
      "13702" => "system security access"
      "13703" => "domain trust management"
      "13704" => "ipsec services"
      "13800" => "certificate services"
      "13824" => "user account management"
      "13825" => "a user account was enabled"
      "13826" => "password change attempted"
      "13827" => "password reset attempted"
      "13828" => "a user account was disabled"
      "13829" => "a user account was deleted"
      "13830" => "a user account was changed"
      "13831" => "a user account was locked out"
      "13832" => "a user account was unlocked"
      "13833" => "the name of an account was changed"
      "13834" => "password hash accessed"
      "13835" => "query for blank password existence"
      "13836" => "local group membership enumerated"
      "13837" => "security group membership enumerated"
      "13838" => "basic app group membership changes"
      "13900" => "ipsec policy enforcement"
      "14000" => "firewall configuration"
      "14100" => "terminal services session management"
      "14200" => "remote connection manager"
      "14300" => "rdp client activity"
      "14400" => "powershell script execution"
      "14500" => "windows defender actions"
      "14600" => "scheduled task execution"
      "14700" => "application errors"
      "14800" => "esent database events"
      "14900" => "logon type tracking"
      "15000" => "audit log management"
      "15100" => "sid history management"
      "15200" => "group type changes"
      "15300" => "acl changes on admin group members"
      "15400" => "rpc integrity violations"
      "15500" => "central access policy changes"
      "15600" => "ntlm authentication failures"
      "15700" => "kerberos pre-auth failures"
      "15800" => "remote desktop access denied"
      "16000" => "esent database management"
      "16001" => "wmi shutdown events"
      "16002" => "wmi activity tracing"
      "16100" => "task scheduler lifecycle"
      "16101" => "task scheduler engine"
      "16102" => "task scheduler service"
      "16200" => "compatibility module"
      "16300" => "com+ security events"
      "16400" => "ipsec negotiation failures"
      "16500" => "certificate services audit"
      "16600" => "sid history and acl events"
      "16700" => "kerberos and ntlm failures"
      "16800" => "rpc message integrity failures"
      "16900" => "central access policy updates"
      "17000" => "dfs and directory services restore"
      "17100" => "ldap query group events"
      "17200" => "screen saver and workstation lock events"
      "113400" => "audit policy change"
      "113568" => "system audit policy"
      "113600" => "kerberos policy change"
      "113700" => "encrypted data recovery policy"
      "113800" => "system security access"
      "113900" => "trusted domain info"
      "17300" => "central access policy"
      "17400" => "central access policy"
      "17500" => "rpc integrity violation"
      "17600" => "ntlm auth failure"
      "17700" => "kerberos pre-auth failure"
      "17800" => "rdp access denied"
      "17900" => "sid history removed"
      "18000" => "directory services restore mode"
      "18100" => "ldap query group created"
      "18200" => "ldap query group changed"
      "18300" => "ldap query group deleted"
      "18400" => "sid history added"

    }
  }
  translate {
    source => "[tmp][system][task]"
    target => "[rule][description]"
    dictionary => {
      "12288" => "system startup/shutdown"
      "12544" => "logon/logoff events"
      "12548" => "privileged logon"
      "12800" => "access to an object"
      "12801" => "permissions changed"
      "12804" => "a scheduled task was created"
      "13056" => "user account changes"
      "13057" => "group member added/removed"
      "13058" => "group created/deleted"
      "13059" => "group properties changed"
      "13060" => "domain policy modified"
      "13061" => "account locked out"
      "13062" => "computer account created/changed/deleted"
      "13312" => "new process created"
      "13313" => "process exited"
      "13400" => "task created/modified/deleted"
      "13568" => "privileges granted/revoked"
      "13600" => "audit policy modified"
      "13700" => "kerberos settings changed"
      "13701" => "efs recovery policy changed"
      "13702" => "system-level privileges granted/removed"
      "13703" => "trust relationships created/removed"
      "13704" => "ipsec service status and failures"
      "13800" => "certificate management events"

      "13824" => "a user account was created"
      "13825" => "user_account_enabled"
      "13826" => "password_change_attempted"
      "13827" => "password_reset_attempted"
