input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    add_field => { "[event][module]" => "tenable_nessus" }
    add_field => { "[event][dataset]" => "tenable_nessus.aws_scanner" }
  }
}
output {
  pipeline { send_to => [enrichments] }
}
