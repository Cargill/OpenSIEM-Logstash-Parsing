input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    lowercase => ["message"]
  }
  json{
    source=>"message"
    target=>"tmp"
  }
  
  mutate {
    add_field => { "[event][module]" => "azure" }
    add_field => { "[event][dataset]" => "azure.anomalies" }
    add_field => { "[log][source][hostname]" => "%{[tmp][tenantid]}" }
  }
  mutate{
    rename => {
      "[tmp][username]" => "[user][name]"
      "[tmp][userprincipalname]" => "[user][email]"
      "[tmp][userinsights][accountdisplayname]" => "[user][full_name]"
      "[tmp][userinsights][accountdomain]" => "[user][domain]"
      "[tmp][userinsights][accountobjectid]" => "[user][id]"
      "[tmp][timegenerated]" => "[event][created]"
      "[tmp][starttime]" => "[event][start]"
      "[tmp][endtime]" => "[event][end]"
      "[tmp][rulename]" => "[rule][name]"
      "[tmp][ruleid]" => "[rule][id]"
      "[tmp][extendedlinks][label]" => "[event][kind]"
      "[tmp][deviceinsights][useragentfamily]" => "[user_agent][device][name]"
      "[tmp][entities][address]" => "[source][ip]"
      "[tmp][anomalydetails][score]" => "[event][risk_score]"
    }
  }
  if [tmp][activityinsights][actionuncommonlyperformedbyuser] {
    mutate{
      add_tag => [ "actionuncommonlyperformedbyuser" ]
    }
  }
  if [tmp][activityinsights][unusualnumberofaadconditionalaccessfailures] {
    mutate{
      add_tag => [ "unusualnumberofaadconditionalaccessfailures" ]
    }
  }
  if [tmp][activityinsights][unusualnumberoffailedsigninofthisuser] {
    mutate{
      add_tag => [ "unusualnumberoffailedsigninofthisuser" ]
    }
  }
  if [tmp][tactics][0] != '' {
    mutate{
      rename =>{
        "[tmp][tactics]" => "[threat][tactic][name]"
      }
    }
  }
  if [tmp][techniques][0] != '' {
    mutate{
      rename =>{
        "[tmp][techniques]" => "[threat][technique][id]"
      }
    }
  }
  date {
    match => [ "[event][created]", "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_es"
  }
  date {
    match => [ "[event][start]", "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][start]"
    tag_on_failure => "_dateparsefailure_es"
  }
  date {
    match => [ "[event][end]", "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][end]"
    tag_on_failure => "_dateparsefailure_ee"
  }
  mutate{
    remove_field => ["tmp"]
  }
}
output {
  pipeline { send_to => [enrichments] }
}