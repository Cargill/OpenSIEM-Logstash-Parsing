# Ansible alert web hook to logstash https listener
input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
} 
filter {
  mutate {
    remove_field => [ "event", "host" ]
  }
  mutate {
    add_field => { 
      "[event][module]" => "azure"
      "[event][dataset]" => "azure.graph_incident"
      "[log][source][hostname]" => "azure.graph_incident" 
    }
  }
  json {
    source => "message"
    target => "tmp"
  }
  ruby {
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  mutate {
    rename => {
      "[tmp][createddatetime]" => "[event][created]"
      "[tmp][lastupdatedatetime]" => "[event][modified]"
      "[tmp][@odata.type]" => "[event][type]"
      "[tmp][summary]" => "[event][original]"
      "[tmp][determination]" => "[event][outcome]"
      "[tmp][displayname]" => "[rule][name]"
      "[tmp][id]" => "[event][id]"
      "[tmp][incidentweburl]" => "[event][reference]"
      "[tmp][severity]" => "[event][severity]"
      "[tmp][status]" => "[vulnerability][status]"
      "[tmp][tenantid]" => "[cloud][account][id]"
    }
  }
  if [tmp][systemtags] and [tmp][systemtags][0] {
    mutate {
      add_tag => [ "%{[tmp][systemtags]}"]
	  }
  }
  if [tmp][systemtags] and [tmp][systemtags][0] {
    mutate {
      add_tag => [ "%{[tmp][customtags]}" ]
	  }
  }
  if [event][category] {
    mutate {
      rename => { "[tmp][classification]" => "[event][category]" }
    }
  }
  if [event][category] {
    mutate {
      rename => { "[tmp][redirectincidentid]" => "[rule][uuid]" }
    }
  } 
  if [event][category] {
    mutate {
      rename =>  {"[tmp][description]" => "[rule][description]" }
    }
  }

  ruby {
    code => "
      refs = []
      category = []
      displayname = []
      usersid = []
      email = []
      srcemail = []
      inetmsgid = []
      kind = []
      srcip = []
      userrole = []
      srcdomain = []
      srcusrdomain = []
      srcusrname = []
      srcnatip = []
      srcaddress = []
      hostosfull = []
      outcome = []
      action = []
      fdsha1 = []
      fdsha256 = []
      fdsize = []
      fdcompany = []
      fdproduct = []
      fdsn = []
      fdpath = []
      fdname = []
      threat_urls = []
      senderip = []
      lasttime = []
      firsttime = []
      subject = []
      dstip = []

      def append_obj(src, dst)
        if src.kind_of?(Array)
          dst.concat src
        else
          dst.push(src)
        end
      end

      def clean_set(evt, fld, obj)
        if !obj.empty?
          obj = obj.map(&:downcase)
          evt.set(fld, obj.uniq)
        end
      end

      event.get('[tmp][alerts]').each do |alerts|
        if !alerts['incidentweburl'].nil?
          append_obj(alerts['incidentweburl'], refs)
        end
        if !alerts['alertweburl'].nil?
          append_obj(alerts['alertweburl'], refs)
        end

        if !alerts['category'].nil?
          append_obj(alerts['category'], category)
        end
        if !alerts['detectionsource'].nil?
          append_obj(alerts['detectionsource'], kind)
        end

        if !alerts['lastactivitydatetime'].nil?
          append_obj(alerts['lastactivitydatetime'], lasttime)
        end
        if !alerts['lastactivitydatetime'].nil?
          append_obj(alerts['firstactivitydatetime'], firsttime)
        end

        if alerts['evidence'].kind_of?(Array)
          alerts['evidence'].each do |evid|
            if !evid['remediationstatus'].nil?
              append_obj(evid['remediationstatus'], action)
            end
            
            if !evid['verdict'].nil?
              append_obj(evid['verdict'], outcome)
            end
            
            if !evid['osplatform'].nil?
              append_obj(evid['osplatform'], hostosfull)
            end
            
            if !evid['devicednsname'].nil?
              append_obj(evid['devicednsname'], srcaddress)
            end
            
            if !evid['lastexternalipaddress'].nil?
              append_obj(evid['lastexternalipaddress'], srcnatip)
            end

            if !evid['dnsdomain'].nil?
              append_obj(evid['dnsdomain'], srcdomain)
            end

            if !evid['rbacgroupname'].nil?
              append_obj(evid['rbacgroupname'], userrole)
            end

            if !evid['lastipaddress'].nil?
              append_obj(evid['lastipaddress'], srcip)
            end

            if !evid['displayname'].nil?
              append_obj(evid['displayname'], displayname)
            end

            if !evid['useraccount'].nil?
              if !evid['useraccount']['usersid'].nil?
                append_obj(evid['useraccount']['usersid'], usersid)
              end
              if !evid['useraccount']['userprincipalname'].nil?
                append_obj(evid['useraccount']['userprincipalname'], email)
              end
              if !evid['useraccount']['displayname'].nil?
                append_obj(evid['useraccount']['displayname'], displayname)
              end
            end

            if !evid['loggedonusers'].nil?
              evid['loggedonusers'].each do |lou|
                if !lou['domainname'].nil?
                  append_obj(lou['domainname'], srcusrdomain)
                end
                if !lou['accountname'].nil?
                  append_obj(lou['accountname'], srcusrname)
                end
              end
            end

            if !evid['filedetails'].nil?
              if !evid['filedetails']['sha1'].nil?
                append_obj(evid['filedetails']['sha1'], fdsha1)
              end
              if !evid['filedetails']['sha256'].nil?
                append_obj(evid['filedetails']['sha256'], fdsha256)
              end
              if !evid['filedetails']['filesize'].nil?
                append_obj(evid['filedetails']['filesize'], fdsize)
              end
              if !evid['filedetails']['filepublisher'].nil?
                append_obj(evid['filedetails']['filepublisher'], fdcompany)
              end
              if !evid['filedetails']['issuer'].nil?
                append_obj(evid['filedetails']['issuer'], fdproduct)
              end
              if !evid['filedetails']['signer'].nil?
                append_obj(evid['filedetails']['signer'], fdsn)
              end
              if !evid['filedetails']['filepath'].nil?
                append_obj(evid['filedetails']['filepath'], fdpath)
              end
              if !evid['filedetails']['filename'].nil?
                append_obj(evid['filedetails']['filename'], fdname)
              end
            end

            if !evid['p2sender'].nil? && !evid['p2sender']['emailaddress'].nil?
              append_obj(evid['p2sender']['emailaddress'], srcemail)
            end

            if !evid['p1sender'].nil? && !evid['p1sender']['emailaddress'].nil?
              append_obj(evid['p1sender']['emailaddress'], srcemail)
            end


            if !evid['internetmessageid'].nil?
              append_obj(evid['internetmessageid'], inetmsgid)
            end
            if !evid['networkmessageids'].nil?
              append_obj(evid['networkmessageids'], inetmsgid)
            end

            if !evid['urls'].nil?
              append_obj(evid['urls'], threat_urls)
            end

            if !evid['url'].nil?
              append_obj(evid['url'], threat_urls)
            end

            if !evid['senderip'].nil?
              senderip.push(evid['senderip'])
            end

            if !evid['subject'].nil?
              subject.push(evid['subject'])
            end

            if !evid['ipaddress'].nil?
              append_obj(evid['ipaddress'], dstip)
            end

          end
        end
      end

      clean_set(event, '[tmp][refs]', refs)
      clean_set(event, '[tmp][category]', category)
      clean_set(event, '[user][full_name]', displayname)
      clean_set(event, '[user][id]', usersid)
      clean_set(event, '[user][email]', email)
      clean_set(event, '[source][user][email]', srcemail)
      clean_set(event, '[file][uid]', inetmsgid)
      clean_set(event, '[event][kind]', kind)
      clean_set(event, '[source][ip]', srcip)
      clean_set(event, '[user][role]', userrole)
      clean_set(event, '[source][domain]', srcdomain)
      clean_set(event, '[source][user][domain]', srcusrdomain)
      clean_set(event, '[source][user][name]', srcusrname)
      clean_set(event, '[source][nat][ip]', srcnatip)
      clean_set(event, '[source][address]', srcaddress)
      clean_set(event, '[host][os][full]', hostosfull)
      clean_set(event, '[event][outcome]', outcome)
      clean_set(event, '[event][action]', action)

      clean_set(event, '[file][hash][sha1]', fdsha1)
      clean_set(event, '[file][hash][sha256]', fdsha256)
      clean_set(event, '[file][size]', fdsize)
      clean_set(event, '[file][pe][company]', fdcompany)
      clean_set(event, '[file][pe][product]', fdproduct)
      clean_set(event, '[file][code_signature][subject_name]', fdsn)
      clean_set(event, '[file][path]', fdpath)
      clean_set(event, '[file][name]', fdname)
      clean_set(event, '[url][full]', threat_urls)
      clean_set(event, '[source][ip]', senderip)
      clean_set(event, '[event][end]', lasttime)
      clean_set(event, '[event][start]', firsttime)
      clean_set(event, '[email][subject]', subject)
      clean_set(event, '[destination][ip]', dstip)
    "
    tag_on_exception => "_alerts_ruby_block"
  }
 
  date {
    match => ["[event][created]","ISO8601"]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  date {
    match => ["[event][modified]","ISO8601"]
    timezone => "GMT"
    locale => "en"
    target => "[event][modified]"
    tag_on_failure => "_dateparsefailure_em"
  }
# 2025-01-15T14:42:00Z
  date {
    match => ["[event][start][0]", "ISO8601", "yyyy-MM-dd't'HH:mm:ss'z'" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][start]"
    tag_on_failure => "_dateparsefailure_es"
  }
  date {
    match => ["[event][end][0]", "ISO8601", "yyyy-MM-dd't'HH:mm:ss'z'" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][end]"
    tag_on_failure => "_dateparsefailure_ee"
  }

  mutate {
    remove_field => [ "tmp" ] 
  }
}
output {
  pipeline { send_to => [enrichments] }
}