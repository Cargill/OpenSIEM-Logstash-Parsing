input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "host","event" ]
    add_field => { "[cloud][provider]" => "azure" }
    add_field => { "[event][module]" => "azure" }
    add_field => { "[event][dataset]" => "azure.atp" }
  }
  json {
    source => "message"
    target => "az"
  }
  # lowercase field names
  ruby {
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  mutate{
    add_field => { "[log][source][hostname]" => "%{[az][aadtenantid]}"}
  }
  mutate {
    rename => {"[az][category]" => "[rule][category]"}
    rename => {"[az][id]" => "[event][id]"}
    rename => {"[az][investigationid]" => "[group][id]"}
    rename => {"[az][severity]" => "[event][severity_name]"}
    rename => {"[az][status]" => "[event][outcome]"}
    rename => {"[az][determination]" => "[event][type]"}
    rename => {"[az][detectionsource]" => "[event][kind]"}
    rename => {"[az][category]" => "[rule][category]"}
    rename => {"[az][title]" => "[event][outcome]"}
    rename => {"[az][description]" => "[rule][description]"}
    rename => {"[az][alertcreationtime]" => "[event][created]"}
    rename => {"[az][firsteventtime]" => "[event][start]"}
    rename => {"[az][lasteventtime]" => "[event][end]"}
    rename => {"[az][lastupdatetime]" => "[event][modified]"}
    rename => {"[az][machineid]" => "[host][id]"}
    rename => {"[az][computerdnsname]" => "[host][hostname]"}
    rename => {"[az][relateduser]" => "[user][name]"}
    rename => {"[az][threatfamilyname]" => "[threat][list][type]" }
    rename => {"[az][threatname]" => "[rule][name]"}
    rename => {"[az][rbacgroupname]" => "[user][group][name]"}
    rename => {"[az][investigationstate]" => "[event][action]"}
    rename => {"[az][incidentid]" => "[event][id]"}
    rename => {"[az][mitretechniques]" => "[threat][technique][id]"}
    rename => {"[az][aadtenantid]" => "[cloud][account][id]"}
  }
  if ![user][name] {
      mutate {
        remove_field => ["[user][name]"]
    }  
  }
# Fields not mapped:
#     rename => {"[az][assignedto]" => ""}
#     rename => {"[az][classification]" => ""}
#     rename => {"[az][detectorid]" => ""}  
#     rename => {"[az][comments]" => ""}
#     rename => {"[az][evidence]" => ""}
#     rename => {"[az][resolvedtime]" => ""}
#     rename => {"[az][domains]" => ""}

    ruby {
      code => "
	    accountname_list = []
	    domainname_list = []
	    mitret_list = []		
        if event.get('[az][loggedonusers]').kind_of?(Array)
          event.get('[az][loggedonusers]').each do |usr|
            if usr['accountname'] != '' && !usr['accountname'].nil?
              accountname_list.push(usr['accountname'])
            end
            if usr['domainname'] != '' && !usr['domainname'].nil?
              domainname_list.push(usr['domainname'])
            end
          end
        end
        if !accountname_list.empty?
          event.set('[user][name]', accountname_list)
        end
        if !domainname_list.empty?
          event.set('[user][domain]', domainname_list)
        end
      "
      tag_on_exception => "_entities_ruby_block"
    }

  mutate {
    remove_field => ["az"]
  }
  date {
    match => ["[event][created]" , "ISO8601" ]
    timezone => "GMT"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  if "_dateparsefailure_ec" in [tags]  {
    mutate {
     remove_field => ["[event][created]"]
    }
  }

  date {
    match => ["[event][start]" , "ISO8601" ]
    timezone => "GMT"
    target => "[event][start]"
    tag_on_failure => "_dateparsefailure_es"
  }
  if "_dateparsefailure_es" in [tags]  {
    mutate {
     remove_field => ["[event][start]"]
    }
  }
  date {
    match => ["[event][end]" , "ISO8601" ]
    timezone => "GMT"
    target => "[event][end]"
    tag_on_failure => "_dateparsefailure_ee"
  }
  if "_dateparsefailure_es" in [tags]  {
    mutate {
     remove_field => ["[event][end]"]
    }
  }
  date {
    match => ["[event][modified]" , "ISO8601" ]
    timezone => "GMT"
    target => "[event][modified]"
    tag_on_failure => "_dateparsefailure_em"
  }
  if "_dateparsefailure_es" in [tags]  {
    mutate {
     remove_field => ["[event][modified]"]
    }
  }
}
output {
  pipeline { send_to => [enrichments] }
}
