input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "event", "host" ]
  }
  mutate {
    add_field => { "[event][module]" => "hana" }
    add_field => { "[event][dataset]" => "hana.db_audit" }
  }
    json {
    source => "message"
    target => "tmp"
  }
  mutate {
    rename => {
      "[tmp][Computer]" => "[log][source][hostname]"
      "[tmp][TenantId]" => "[cloud][account][id]"
      "[tmp][TimeGenerated]" => "[event][created]"
      "[tmp][_Internal_WorkspaceResourceId]" => "[cloud][project][id]"	  
      "[tmp][_ResourceId]" => "[cloud][instance][name]"
      "[tmp][_ItemId]" => "[cloud][instance][id]"
      "[tmp][RawData]" => "[error][message]"
    }
  }
  mutate {
    gsub => [
      "[error][message]", "^(\\s+)?command:(\\s+)?", ""
    ]
  }
  
  # "[event][created]" "2024-05-30t13:41:52.0000000z",
  date {
    match => ["[event][created]", "ISO8601"]
    timezone => "GMT"
    locale => "ec"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  if ![log][source][hostname] {
    grok {
      match => { "[cloud][instance][name]" => "^.*\/(?<[log][source][hostname]>.*?)$" }
    }
  }
  mutate {
    remove_field => [ "tmp" ]
  }
}
output {
  pipeline { send_to => [enrichments] }
}