# Ansible alert web hook to logstash https listener
input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "event", "host" ]
  }
  mutate {
    add_field => {
      "[event][module]" => "azuregraph"
      "[event][dataset]" => "azuregraph.defender_usb"
      "[log][source][hostname]" => "azuregraph.defender_usb"
    }
  }
  json {
    source => "message"
    target => "az"
    skip_on_invalid_json => true
  }
  # lowercase field names
  ruby {
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  mutate {
    rename => { 
      "[az][initiatingprocessaccountdomain]" => "[user][domain]"
      "[az][initiatingprocessaccountname]" => "[user][name]"
      "[az][initiatingprocessaccountupn]" => "[user][email]"
      "[az][reportid]" => "[event][id]"
      "[az][deviceid]" => "[host][id]"
      "[az][devicename]" => "[host][hostname]"
      "[az][filename]" => "[file][name]"
      "[az][folderpath]" => "[file][path]"
      "[az][sha256]" => "[file][hash][sha256]"
      "[az][driveletter]" => "[file][drive_letter]"
      "[az][timestamp]" => "[event][created]"
      "[az][productname]" => "[file][device]"
      "[az][manufacturer]" => "[file][type]"
    }
  }
  ## "Timestamp": "2025-03-19T11:21:55.0039444Z"
  date {
    match => [ "[event][created]" , "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  mutate {
    remove_field => [ "az" ]
  }
}
output {
  pipeline { send_to => [enrichments] }
}
