input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    id => "eventhub_atp_mutate_K6d7hbfHwmnYkcRe7zuBs3"
    remove_field => [ "host","event" ]
  }
  mutate {
    id => "eventhub_atp_mutate_BLQ3LvnSRTfBBFWx5gpgyU"
    add_field  => {
      "[event][dataset]" => "azure.atp"
      "[event][module]" => "eventhub"
    }
  }
  json {
    id => "eventhub_atp_json_NfUFeyrohYbsFsodf8ybZW" 
    source => "message"
    target => "az"
    skip_on_invalid_json => true
  }
  # lowercase field names
  ruby {
    id => "eventhub_atp_ruby_U8cij2R3kkYBeBPUVf44My" 
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  json {
    id => "eventhub_atp_json_CVuVkhQ4fqWvc49yFkGrWj" 
    source => "[az][properties][additionalfields]"
    target => "[az][properties][additionalfields]"
    skip_on_invalid_json => true
  }
  json {
    id => "eventhub_atp_json_6aoz6uRQWNNkyjNW93rDoE" 
    source => "[az][properties][ipaddresses]"
    target => "[az][properties][ipaddresses]"
    skip_on_invalid_json => true
  }
  json {
    id => "eventhub_atp_json_SLMds8WVW7x6RkiDk7bgLr" 
    source => "[az][properties][additionalfields][tokenmodificationproperties]"
    target => "[az][properties][additionalfields][tokenmodificationproperties]"
    skip_on_invalid_json => true
  }
  json {
    id => "eventhub_atp_json_2yxp5dy5snxBinNwD8HJzr" 
    source => "[az][properties][raweventdata][properties]"
    target => "[az][properties][raweventdata][properties]"
    skip_on_invalid_json => true
  }
  json {
    id => "eventhub_atp_json_35kWRriXU5tTumzNiNJgC5" 
    source => "[az][properties][raweventdata][claims]"
    target => "[az][properties][raweventdata][claims]"
    skip_on_invalid_json => true
  }
  json {
    id => "eventhub_atp_json_ZkcUaN3XMMQPqfTbBMXGSF" 
    source => "[az][properties][raweventdata][authorization]"
    target => "[az][properties][raweventdata][authorization]"
    skip_on_invalid_json => true
  }

  # lowercase field names
  ruby {
    id => "eventhub_atp_ruby_XBhCJdnzWoaKivUpeLena6" 
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  mutate {
    id => "eventhub_atp_mutate_H8jTsdvsghxByiBAFLJEDF"
    add_field => { 
      "[log][source][hostname]" => "%{[cloud][account][id]}" 
    }
    rename => { 
      "[az][tenant]" => "[cloud][account][name]"
      "[az][category]" => "[event][category]"
      "[az][operationname]" => "[rule][name]"
      "[az][properties][accountdisplayname]" => "[user][email]"
      "[az][properties][accountid]" => "[user][id]"
      "[az][properties][actiontype]" => "[event][action]"
      "[az][tenantid]" => "[cloud][account][id]"
      "[az][_timereceivedbysvc]" => "[event][ingested]"
      "[az][time]" => "[event][created]"
      "[az][properties][ipaddress]" => "[source][ip]"
      "[az][properties][auditsource]" => "[event][kind]"
      "[az][properties][useragent]" => "[user_agent][name]"
      "[az][properties][reportid]" => "[rule][id]"
      "[az][properties][city]" => "[source][geo][city_name]"
      "[az][properties][timestamp]" => "[event][created]"
      "[az][properties][processid]" => "[process][pid]"
      "[az][properties][processcommandline]" => "[process][command_line]"
      "[az][properties][initiatingprocessfolderpath]" => "[process][parent][executable]"
	  "[az][properties][initiatingprocesssha1]" => "[process][parent][hash][sha1]"
      "[az][properties][initiatingprocessmd5]" => "[process][parent][hash][md5]"
      "[az][properties][initiatingprocesssha256]" => "[process][parent][hash][sha256]"
      "[az][properties][initiatingprocessparentid]" => "[package][size]"
      "[az][properties][initiatingprocesslogonid]" => "[process][parent][ppid]"
      "[az][properties][initiatingprocesscommandline]" => "[process][parent][command_line]"
      "[az][properties][machinegroup]" => "[group][name]"
      "[az][properties][logonid]" => "[user][id]"
      "[az][properties][accountname]" => "[user][name]"
	  "[az][properties][accountdomain]" => "[host][domain]"
      "[az][properties][devicename]" => "[host][hostname]"
      "[az][properties][deviceid]" => "[host][id]"
      "[az][properties][osbuild]" => "[host][os][version]"
      "[az][properties][onboardingstatus]" => "[event][action]"
      "[az][properties][devicecategory]" => "[event][kind]"
      "[az][properties][exposurelevel]" => "[event][severity]"
      "[az][properties][osplatform]" => "[host][os][name]"
      "[az][properties][osversioninfo]" => "[host][os][version]"
      "[az][properties][devicetype]" => "[host][type]"
      "[az][properties][initiatingprocessid]" => "[process][pid]"
      "[az][properties][initiatingprocessaccountdomain]" => "[user][domain]"
      "[az][properties][accountsid]" => "[user][name]"
      "[az][properties][initiatingprocessversioninfoproductversion]" => "[process][pe][file_version]"
      "[az][properties][initiatingprocessversioninfocompanyname]" => "[process][pe][company]"
      "[az][properties][filesize]" => "[file][size]"
      "[az][properties][md5]" => "[file][hash][md5]"
      "[az][properties][sha1]" => "[file][hash][sha1]"
      "[az][properties][sha256]" => "[file][hash][sha256]"
      "[az][properties][localip]" => "[destination][ip]"
      "[az][properties][initiatingprocessaccountname]" => "[user][name]"

      "[az][properties][initiatingprocessversioninfofiledescription]" => "[rule][ruleset]"

      "[az][properties][additionalfields][removablestoragepolicy]" => "[rule][ruleset]"
      "[az][properties][additionalfields][removablestoragepolicyverdict]" => "[event][outcome]"
      "[az][properties][additionalfields][classname]" => "[cmdb][class][name]"
      "[az][properties][additionalfields][removablestorageaccess]" => "[file][attributes]"
      "[az][properties][additionalfields][medianame]" => "[file][sharename]"
      "[az][properties][additionalfields][deviceinstanceid]" => "[file][device]"
      "[az][properties][remoteip]" => "[source][ip]"
      "[az][properties][protocol]" => "[network][protocol]"
      "[az][properties][initiatingprocessparentfilename]" => "[process][parent][name]"
      "[az][properties][application]" => "[process][name]"
      "[az][properties][initiatingprocessfilename]" => "[process][name]"
      "[az][properties][remoteport]" => "[source][port]"
      "[az][properties][initiatingprocessversioninfoproductname]" => "[process][pe][product]"
      "[az][properties][initiatingprocessaccountupn]" => "[user][name]"
      "[az][properties][initiatingprocessaccountsid]" => "[user][id]"
      "[az][properties][initiatingprocessremotesessiondevicename]" => "[source][address]"
      "[az][properties][initiatingprocessremotesessionip]" => "[source][ip]"
      "[az][properties][remoteurl]" => "[url][full]"
      "[az][properties][additionalfields][initiatingprocessposixfilepermissions]" => "[file][attributes]"
      "[az][properties][additionalfields][scriptcontent]" => "[event][original]"	  
      "[az][properties][additionalfields][source mac]" => "[source][mac]"
      "[az][properties][additionalfields][destination mac]" => "[destination][mac]"
      "[az][properties][additionalfields][direction]" => "[network][direction]"
      "[az][properties][additionalfields][method]" => "[http][request][method]"
      "[az][properties][additionalfields][status_code]" => "[http][response][status_code]"
      "[az][properties][additionalfields][response_body_len]" => "[http][response][bytes]"
      "[az][properties][additionalfields][request_body_len]" => "[http][request][bytes]"
      "[az][properties][additionalfields][status_msg]" => "[error][message]"
      "[az][properties][additionalfields][uri]" => "[url][full]"
      "[az][properties][additionalfields][version]" => "[http][version]"
      "[az][properties][additionalfields][server_version]" => "[host][os][version]"
      "[az][properties][additionalfields][username]" => "[use][name]"
      "[az][properties][additionalfields][server_dns_domain_name]" => "[host][domain]"
      "[az][properties][additionalfields][hostname]" => "[source][address]"
      "[az][properties][additionalfields][server_dns_computer_name]" => "[host][hostname]"
      "[az][properties][additionalfields][flags]" => "[rule][category]"
      "[az][properties][additionalfields][operationtype]" => "[rule][ruleset]"
      "[az][properties][additionalfields][fileoperation]" => "[error][message]"
      "[az][properties][additionalfields][pipename]" => "[process][thread][name]"
      "[az][properties][additionalfields][packet size]" => "[network][bytes]"
      "[az][properties][additionalfields][dnsquerystring]" => "[dns][question][name]"                                        
      "[az][properties][additionalfields][imagename]" => "[dll][path]"
      "[az][properties][additionalfields][imagesha256]" => "[dll][hash][sha256]"
      "[az][properties][additionalfields][imagesha1]" => "[dll][hash][sha1]"
      "[az][properties][additionalfields][imagemd5]" => "[dll][hash][md5]"
      "[az][properties][additionalfields][qclass_name]" => "[dns][question][class]"
      "[az][properties][additionalfields][query]" => "[dns][question][name]"
      "[az][properties][additionalfields][qclass]" => "[dns][id]"
      "[az][properties][additionalfields][qtype_name]" => "[dns][question][type]"
      "[az][properties][additionalfields][qtype]" => "[dns][op_code]"
      "[az][properties][additionalfields][resp_pkts]" => "[destination][packets]"
      "[az][properties][additionalfields][resp_ip_bytes]" => "[destination][bytes]"
      "[az][properties][additionalfields][conn_state]" => "[event][outcome]"                
      "[az][properties][additionalfields][orig_ip_bytes]" => "[source][bytes]"
      "[az][properties][additionalfields][orig_pkts]" => "[source][packets]"
      "[az][properties][additionalfields][duration]" => "[event][duration]"
      
	  "[az][properties][additionalfields][groupdomainname]" => "[group][domain]"
      "[az][properties][additionalfields][groupname]" => "[group][name]"
      "[az][properties][additionalfields][groupsid]" => "[group][id]"

      "[az][properties][raweventdata][additional_details][source mac]" => "[source][mac]"
      "[az][properties][raweventdata][additional_details][destination mac]" => "[destination][mac]"
      "[az][properties][raweventdata][additional_details][file_path]" => "[file][path]"
      "[az][properties][raweventdata][additional_details][size]" => "[file][size]"
      "[az][properties][raweventdata][additional_details][service_name]" => "[process][name]"
      tag_on_failure => "_mutate_error_2"
    }
  } 
  if [az][properties][raweventdata][objectid] =~ "^.*?\@.*?\.\w+$" {
    mutate {
      id => "eventhub_atp_mutate_QD2prk2yjbbWkNna8gtCcq"
      replace => { "[user][email]" => "%{[az][properties][raweventdata][objectid]}" }
      tag_on_failure => "_mutate_error_3"
	}
  }
  if [az][properties][objecttype] == "file" {
    mutate {
      id => "eventhub_atp_mutate_ANCeiEoVaR4tUUYpQ22rsx"
      rename => { 
        "[az][properties][objectname]" => "[file][name]"
      }
      tag_on_failure => "_mutate_error_4"
    }
  }
  if [event][action] == "sslconnectioninspected" {
    mutate {
      id => "eventhub_atp_mutate_Xav2qF3dXpJNyZv38sCcqz"
      rename => { 
        "[az][properties][additionalfields][cipher]" => "[tls][cipher]"
        "[az][properties][additionalfields][curve]" => "[tls][curve]"
        "[az][properties][additionalfields][ja3s]" => "[tls][server][ja3s]"
        "[az][properties][additionalfields][ja3]" => "[tls][client][ja3]"
        "[az][properties][additionalfields][issuer]" => "[tls][server][issuer]"
        "[az][properties][additionalfields][server_name]" => "[tls][client][server_name]"
        "[az][properties][additionalfields][subject]" => "[tls][server][subject]"
        "[az][properties][additionalfields][client_issuer]" => "[tls][client][issuer]"
        "[az][properties][additionalfields][client_subject]" => "[tls][client][subject]"
      }
      tag_on_failure => "_mutate_error_5"
    }
  }
  if [az][properties][raweventdata][additional_details][hash_type] == "sha1" {
    mutate {
      id => "eventhub_atp_mutate_dNCh3YcJgjRi3RQyxcvHRx"
      rename => { 
        "[az][properties][raweventdata][additional_details][file_hash]" => "[file][hash][sha1]"
      }
      tag_on_failure => "_mutate_error_6"
    }
  } else if [az][properties][raweventdata][additional_details][hash_type] == "md5" {
    mutate {
      id => "eventhub_atp_mutate_idmoP3JbnEbB9PfnToyy3p"
      rename => { 
        "[az][properties][raweventdata][additional_details][file_hash]" => "[file][hash][md5]"
      }
      tag_on_failure => "_mutate_error_7"
    }
  } else if [az][properties][raweventdata][additional_details][hash_type] == "sha256" {
    mutate {
      id => "eventhub_atp_mutate_RP9S7iKUd5Vu4uKkvKrhN4"
      rename => { 
        "[az][properties][raweventdata][additional_details][file_hash]" => "[file][hash][sha256]"
      }
      tag_on_failure => "_mutate_error_8"
    }
  }

  if [az][properties][filename] and [az][properties][folderpath] {
    mutate {
      id => "eventhub_atp_mutate_33VVy2rLrUy2RcVpPLdfQ8"
      rename => { 
        "[az][properties][filename]" => "[file][name]"
        "[az][properties][folderpath]" => "[file][path]"
      }
      tag_on_failure => "_mutate_error_9"
    }
  } else if [az][properties][folderpath] {
    grok {
      id => "eventhub_atp_grok_JaHz2rAEF66Yc7o4rjAteo" 
      match => { "[az][properties][folderpath]" => "^(?<[file][path]>.*\\)?(?<[file][name]>.*?)$" }
    }
  } else {
    mutate {
      id => "eventhub_atp_mutate_JxWZx3njx4yAPcWzrCAToQ"
      rename => { 
        "[tmp][file]" => "[process][executable]"
      }
      tag_on_failure => "_mutate_error_10"
    }
  }
  if [az][properties][type] == "user" {
    mutate {
      id => "eventhub_atp_mutate_mcoSRHu75HA8JYnSrPEM9C"
      rename => { 
  	    "[az][properties][onpremsid]" => "[user][id]"
  	    "[az][properties][country]" => "[user][geo][country_name]"
  	    "[az][properties][jobtitle]" => "[user][title]"
  	    "[az][properties][sipproxyaddress]" => "[source][nat][ip]"
  	    "[az][properties][cloudsid]" => "[user][id]"
  	    "[az][properties][emailaddress]" => "[user][email]"
  	    "[az][properties][state]" => "[user][geo][region_name]"
  	    "[az][properties][risklevel]" => "[event][risk_score]"
  	    "[az][properties][accountupn]" => "[user][name]"
  	    "[az][properties][department]" => "[user][business][unit]"
      }
      add_field => { "[user][effective][full_name]" => "%{[az][properties][givenname]} %{[az][properties][surname]}" }
      tag_on_failure => "_mutate_error_11"
    }
  }
  # "[event][ingested]" # "2025-02-12t09:50:30.6400000z"
  # "[event][created]" # "2025-02-12t09:55:13.7049544z"
  date {
    id => "eventhub_atp_date_8W6FU7fqeQJyi7UmJkbdEz" 
    match => [ "[event][created]" , "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  date {
    id => "eventhub_atp_date_DLFmQ7n8Z8aoQhUQLZRmQN" 
    match => [ "[event][ingested]" , "ISO8601" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][ingested]"
    tag_on_failure => "_dateparsefailure_ei"
  }

  mutate {
    id => "eventhub_atp_mutate_H9YBzdyyDprdhdLKo47VXa"
    remove_field => [ "tmp", "az" ]
    tag_on_failure => "_mutate_error_12"
  }
}
output {
  pipeline { send_to => [enrichments] }
}
