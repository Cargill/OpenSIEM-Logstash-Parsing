input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => ["event", "host", "log","user" ]
  }
  mutate{
    copy => { "[message]" => "[event][original]" }
  }
  mutate {
    add_field => { 
      "[event][module]" => "sap"
      "[event][dataset]" => "sap.btp_calm"
    }
  }
  json {
    source => "message"
    target => "tmp"
  }
  if [tmp][tenant] {
    mutate{
        add_field =>{ "[log][source][hostname]" => "%{[tmp][tenant]}" }
    }
  }
  mutate {
    rename => { 
      "[tmp][als_service_id]" => "[service][id]"
      "[tmp][category]" => "[event][category]"
      "[tmp][message_uuid]" => "[rule][uuid]"
      "[tmp][org_id]" => "[cloud][project][id]"
      "[tmp][time]" => "[event][created]"
      "[tmp][space_id]" => "[cloud][instance][id]"
      "[tmp][tenant]" => "[cloud][account][id]"
      "[tmp][object][type]" => "[event][type]"
      "[tmp][id]" => "[event][id]"
      "[tmp][ip]" => "[source][ip]"
      "[tmp][user]" => "[user][name]"
      "[tmp][app_or_service_id]" => "[group][id]"
    }
  }
  json {
    source => "[tmp][message]"
    target => "tmp_error"
  }
  json {
    source => "[tmp_error][data]"
    target => "tmp_data"
  }
  mutate{
    rename => {
        "[tmp_error][object][type]" => "[event][type]"
        "[tmp_error][ip]" => "[source][ip]"
        "[tmp_data][level]" => "[event][severity_name]"
        "[tmp_data][msgId]" => "[event][id]"
    }
  }
  if [event][category] == "audit.security-events" {
    if [tmp_data] {
      grok {
        match => { 
          "[tmp_data][message]" => "(?<[event][action]>[a-zA-Z]+)(?<data>[^:]+: )?(?<rest_msg>.*?)$"
        }
    }
    }

    kv {
      whitespace => "strict"
      source => "rest_msg"
      field_split => ","
      value_split => "="
      target => "newdata"
      trim_key => [" "]
    }

    mutate {
      rename => { "[newdata][principal]" => "[source][user][id]" }
      rename => { "[newdata][authenticationType]" => "[event][kind]" }
    }

    if [event][action] in ["IdentityProviderAuthenticationSuccess","UserAuthenticationSuccess"] {
      grok {
        match => { 
          "[data]" => "\s+?\('(?<[source][user][name]>.*?)'\)"
        }
    }
    }
  }

  date {
    match => [ "[event][created]", "ISO8601" ]
    timezone => "GMT"
    locale => "ec"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  mutate {
    remove_field => [ "tmp", "tmp_data", "tmp_error", "newdata", "data", "rest_msg" ]
  }
}
output {
  pipeline { send_to => [enrichments] }
}