input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
	remove_field => ["event", "host", "log","user" ]
  }
  mutate {
    add_field => { 
      "[event][module]" => "azure"
    }
  }
  json {
    source => "message"
    target => "tmp"
  } 
# lowercase field names
  ruby {
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  mutate {
    rename => { 
      "[tmp][resourceid]" => "[log][source][hostname]"
      "[tmp][time]" => "[event][created]"
      "[tmp][category]" => "[event][kind]"
      "[tmp][properties][msg]" => "[error][message]"
    }
    # category":"azfwdnsquery"
    rename => { 
      "[tmp][properties][queryclass]" => "[dns][question][class]"
      "[tmp][properties][errormessage]" => "[error][message]"
      "[tmp][properties][protocol]" => "[network][transport]"
      "[tmp][properties][queryid]" => "[dns][id]"
      "[tmp][properties][queryname]" => "[dns][question][name]"
      "[tmp][properties][querytype]" => "[dns][question][type]"
      "[tmp][properties][responsecode]" => "[dns][response_code]"
      "[tmp][properties][responseflags]" => "[dns][header_flags]"
      "[tmp][properties][sourceip]" => "[source][ip]"
      "[tmp][properties][sourceport]" => "[source][port]"
    }
    # azfwidpssignature"
    rename => { 
      "[tmp][properties][description]" => "[rule][description]"
      "[tmp][properties][action]" => "[event][action]"
      "[tmp][properties][destinationip]" => "[destination][ip]"
      "[tmp][properties][destinationport]" => "[destination][port]"
      "[tmp][properties][category]" => "[rule][category]"
      "[tmp][properties][severity]" => "[event][severity]"
      "[tmp][properties][signatureid]" => "[rule][id]"
    }
  # azfwapplicationrule
    rename => { 
      "[tmp][properties][rulecollectiongroup]" => "[rule][description]"
      "[tmp][properties][policy]" => "[rule][category]"
      "[tmp][properties][istlsinspected]" => "[tls][established]"
      "[tmp][properties][targeturl]" => "[url][registered_domain]"
      "[tmp][properties][rulecollection]" => "[rule][ruleset]"
      "[tmp][properties][rule]" => "[rule][name]"
      "[tmp][properties][isexplicitproxyrequest]" => false
      "[tmp][properties][webcategory]" => "[event][category]"
      "[tmp][properties][actionreason]" => "[event][reason]"
      "[tmp][properties][fqdn]" => "[url][full]"
    }
  # ntanetanalytics
    rename => {
      "[tmp][type]" => "[event][kind]"
      "[tmp][packetsdesttosrc]" => "[destination][packets]"
      "[tmp][_internal_workspaceresourceid]" => "[cloud][project][name]"
      "[tmp][macaddress]" => "[host][mac]"
      "[tmp][aclrule]" => "[rule][name]"
      "[tmp][l4protocol]" => "[network][transport]"
      "[tmp][destregion]" => "[cloud][region]"
      "[tmp][_itemid]" => "[event][id]"
      "[tmp][flowstatus]" => "[event][action]"
      "[tmp][subtype]" => "[event][type]"
      "[tmp][flowtype]" => "[network][name]"
      "[tmp][destip]" => "[destination][ip]"
      "[tmp][destsubscription]" => "[cloud][account][id]"
      "[tmp][flowdirection]" => "[network][direction]"
      "[tmp][bytessrctodest]" => "[source][bytes]"
      "[tmp][srcregion]" => "[source][geo][region_name]"
      "[tmp][srcvm]" => "[source][address]"
      "[tmp][destvm]" => "[cloud][instance][name]"
      "[tmp][destport]" => "[destination][port]"
      "[tmp][tenantid]" => "[organization][id]"
      "[tmp][packetssrctodest]" => "[source][packets]"
      "[tmp][srcip]" => "[source][ip]"
      "[tmp][srcsubscription]" => "[labels][source_subscription_id]"
      "[tmp][srcnic]" => "[observer][ingress][interface][name]"
      "[tmp][srcsubnet]" => "[labels][source_subnet]"
      "[tmp][l7protocol]" => "[network][protocol]"
      "[tmp][country]" => "[destination][geo][country_iso_code]"
      "[tmp][bytesdesttosrc]" => "[destination][bytes]"
      "[tmp][destpublicips]" => "[labels][destination_public_ips]"
      "[tmp][destnic]" => "[observer][egress][interface][name]"
      "[tmp][destsubnet]" => "[labels][destination_subnet]"
      "[tmp][srcpublicips]" => "[labels][source_public_ips]"
      "[tmp][aclgroup]" => "[rule][ruleset]"
      "[tmp][flowlogresourceid]" => "[observer][name]"
      "[tmp][faschemaversion]" => "[observer][version]"
      "[tmp][targetresourcetype]" => "[cloud][service][name]"
      "[tmp][targetresourceid]" => "[cloud][project][id]"
      "[tmp][timegenerated]" => "[event][modified]"
      "[tmp][timeprocessed]" => "[event][created]"
      "[tmp][_timereceived]" => "[event][ingested]"
      "[tmp][flowstarttime]" => "[event][start]"
      "[tmp][flowendtime]" => "[event][end]"
    }	
  }
  if [event][kind] == "ntanetanalytics" {
    mutate {
      add_field => {
        "[cloud][provider]" => "azure"
        "[observer][type]" => "firewall"
      }
      copy => {
        "message" => "[event][original]"
      }
      split => {
        "[event][type]" => ","
      }
    }
    ruby {
      code => '
        {
          "[labels][source_public_ips]" => "[source][nat][ip]",
          "[labels][destination_public_ips]" => "[destination][nat][ip]"
        }.each do |src_path, dst_path|
          raw = event.get(src_path)
          next unless raw.is_a?(String)
          ips = raw.scan(/\b(?:\d{1,3}\.){3}\d{1,3}\b/)
          next if ips.empty?
          event.set(dst_path, ips.uniq.first)
        end
      '
      tag_on_exception => "_nat_ip_parse_failure"
    }
  }
  if [event][kind] == "AzureFirewallDnsProxy" {
    grok {
      match => { "[error][message]" => "DNS Request: (?<[source][ip]>\d+\.\d+\.\d+\.\d+):(?<[source][port]>\d+) .*? (?<[dns][id]>\d+) (?<[dns][question][type]>\w+) (?<[dns][question][class]>\w+) (?<[dns][question][name]>.*?)\. (?<[network][transport]>\w+) \d+ \w+ \d+ (?<[dns][response_code]>\w+) (?<[dns][header_flags]>(\w+,)+\w+) \d+" }
    }
  }  
  if [event][kind] == "AzureFirewallNetworkRule" or [event][kind] == "AzureFirewallApplicationRule" {
    grok {
      match => { "[error][message]" => "^(?<[network][protocol]>.*?)\w+ .*?from (?<[source][ip]>\d+.\d+.\d+.\d+):(?<[source][port]>\d+) to ((?<[destination][ip]>\d+.\d+.\d+.\d+)|(?<[destination][address]>.*?)):(?<[destination][port]>\d+).*?Action: (?<[event][action]>\w+).*?\.+ (Policy: ((?<[rule][category]>.*?) Rule Collection Group: (?<[rule][ruleset]>.*?) Rule Collection: (?<[observer][name]>.*?) Rule: (?<[rule][name]>.*?))|((?<[rule][name]>.*?)))$" }
    }
  } 
  if ![log][source][hostname] {
    if [tmp][targetresourceid] {
      mutate {
        copy => {
          "[tmp][targetresourceid]" => "[log][source][hostname]"
        }
      }
    } else if [tmp][flowlogresourceid] {
      mutate {
        copy => {
          "[tmp][flowlogresourceid]" => "[log][source][hostname]"
        }
      }
    }
  }
  translate {
    source => "[event][kind]"
    target => "[event][dataset]"
      dictionary => {
        "AzureFirewallDnsProxy" => "azure.dns"
        "AZFWDnsQuery" => "azure.dns"
        "AzureFirewallNetworkRule" => "azure.fw"
        "AzureFirewallApplicationRule" => "azure.fw"
        "AZFWNetworkRule" => "azure.fw"
        "AZFWIdpsSignature" => "azure.ids"
        "AZFWApplicationRule" => "azure.proxy"
        "AZFWFlowTrace" => "azure.flow"
        "ntanetanalytics" => "azure.fw_metrics"
      }
      fallback => "azure.fw_metrics"
  }
  translate {
    source => "[event][action]"
    target => "[event][outcome]"
      dictionary => {
        "allowed" => "success"
        "denied" => "failure"
      }
  }

  # "[event][created]" "2024-02-29t16:41:47.9085510z"
  date {
    match => ["[event][created]" , "yyyy-MM-dd'T'HH:mm:ss.SSSSSSS'Z'", "yyyy-MM-dd't'HH:mm:ss.SSSSSSS'z'" ]
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }
  date {
    match => ["[event][modified]" , "yyyy-MM-dd'T'HH:mm:ss.SSSSSSS'Z'", "yyyy-MM-dd't'HH:mm:ss.SSSSSSS'z'" ]
    target => "[event][modified]"
    tag_on_failure => "_dateparsefailure_em"
  }
  date {
    match => ["[event][ingested]" , "yyyy-MM-dd'T'HH:mm:ss.SSSSSSS'Z'", "yyyy-MM-dd't'HH:mm:ss.SSSSSSS'z'" ]
    target => "[event][ingested]"
    tag_on_failure => "_dateparsefailure_ei"
  }
  date {
    match => ["[event][start]" , "yyyy-MM-dd'T'HH:mm:ss.SSSSSSS'Z'", "yyyy-MM-dd't'HH:mm:ss.SSSSSSS'z'" ]
    target => "[event][start]"
    tag_on_failure => "_dateparsefailure_es"
  }
  date {
    match => ["[event][end]" , "yyyy-MM-dd'T'HH:mm:ss.SSSSSSS'Z'", "yyyy-MM-dd't'HH:mm:ss.SSSSSSS'z'" ]
    target => "[event][end]"
    tag_on_failure => "_dateparsefailure_es"
  }
  mutate {
    remove_field => [ "tmp" ]
  }
}
output {
  pipeline { send_to => [enrichments] }
}
