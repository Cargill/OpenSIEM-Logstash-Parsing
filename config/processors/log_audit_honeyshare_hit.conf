input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}

filter {
  mutate {
    add_field => { "[event][module]" => "honeyshare" }
    add_field => { "[event][dataset]" => "honeyshare.smb_hit" }
  }
}

output {
  pipeline { send_to => [enrichments] }
}
