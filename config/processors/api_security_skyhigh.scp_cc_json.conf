# exclude from url enrichment
# Internal config contains Cargil only info
# https://success.skyhighsecurity.com/Skyhigh_Secure_Web_Gateway_(Cloud)/Using_the_Forensics_API_for_Reporting/Reporting_Fields
input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  ### Skyhigh SCP cloud conector, json format, formaly McAfee MCP API
  if [message] == "[" or [message] == "]" {
    drop { }
  }
  mutate {
    remove_field => [ "event", "host" ]
  }
  mutate {
    add_field => { "[event][module]" => "skyhigh" }
    add_field => { "[event][dataset]" => "skyhigh.scp" }
    add_field => { "[log][source][hostname]" => "api_mcp"}
  }
  # remove syslog header
  grok {
    match => { "message" => ".*?(?<msg>\{.*?)(,(\s+)?)?$" }
  }

  json {
    source => "msg"
    target => "scp"
  }
  mutate {
    remove_field => [ "msg" ]
  }
  ruby {
    path => "${LOGSTASH_HOME}/config/lower.rb"
    tag_on_exception => "_lowecase_ruby_block"
  }
  mutate {
    rename => {
      "[scp][pop_country_code]" => "[observer][geo][country_iso_code]"
      "[scp][destination_ip]" => "[destination][ip]"
      "[scp][proxy_port]" => "[destination][nat][port]"
      "[scp][destination_port]" => "[destination][port]"
      "[scp][request_timestamp_epoch]" => "[event][created]"
      "[scp][request_timestamp]" => "[event][ingested]"
      "[scp][filename]" => "[file][name]"
      "[scp][client_to_server_bytes]" => "[http][request][bytes]"
      "[scp][http_action]" => "[http][request][method]"
      "[scp][referer]" => "[http][request][referrer]"
      "[scp][server_to_client_bytes]" => "[http][response][bytes]"
      "[scp][http_status_code]" => "[http][response][status_code]"
      "[scp][pop_egress_ip]" => "[observer][egress][ip]"
      "[scp][pop_ingress_ip]" => "[observer][ingress][ip]"
      "[scp][process_name]" => "[process][name]"
      "[scp][client_system_name]" => "[source][address]"
      "[scp][client_ip]" => "[source][ip]"
      "[scp][source_ip]" => "[source][nat][ip]"
      "[scp][requested_host]" => "[url][domain]"
      "[scp][requested_path]" => "[url][path]"
      "[scp][uri_scheme]" => "[url][scheme]"
      "[scp][user_id]" => "[user][id]"
      "[scp][user_agent_product]" => "[user_agent][name]"
      "[scp][user_agent_comment]" => "[user_agent][original]"
      "[scp][user_agent_version]" => "[user_agent][version]"
      "[scp][block_reason]" => "[rule][ruleset]"
      "[scp][category]" => "[rule][category]"
      "[scp][discarded_host]" => "[discarded_host]"
      "[scp][last_rule]" => "[rule][uuid]"
      "[scp][mw_probability]" => "[event][risk_score]"
      "[scp][result]" => "[event][action]"
      "[scp][reputation]" => "[event][severity_name]"
      "[scp][ssl_client_prot]" => "[tls][client][x509][version_number]"
      "[scp][ssl_server_prot]" => "[tls][server][x509][version_number]"
      "[scp][media_type]" => "[http][request][mime_type]"
      "[scp][virus]" => "[rule][name]"
      "[scp][application_type]" => "[service][name]"
      "[scp][location]" => "[cloud][provider]"
      "[scp][duration]" => "[event][duration]"
      "[scp][server_bandwidth_time]" => "[network][bytes]"
      "[scp][internal_proc_time]" => "[process][uptime]"
      "[scp][server_latency_time]" => "[event][sequence]"
    }
  }
      mutate {
        split => { "[rule][category]" => ", " }
      }
      
      if [scp][username] and [scp][username] =~ ".*?\\.*?" {
        grok {
          match => { "[scp][username]" => "(?<[user][domain]>.*?)\\(?<[user][name]>.*?)$" }
          timeout_millis => 500
        }
      } else {
        mutate {
          rename => { "[scp][username]" => "[user][name]" }
        }
      }
      if [source][ip] and [source][ip] =~ "source_ip" {
        mutate {
          remove_field => ["[source][ip]"]
        }
      }
      # Create [url][full] 
      mutate {
        add_field => { "[url][full]" => "%{[[url][scheme]]}://%{[[url][domain]]}%{[[url][path]]}" }
      }

      mutate {
        lowercase => [ "[event][action]" ]
      }
      if [event][action] =~ "observed" {
        mutate {
          replace => { "[event][action]" => "allowed" }
        }
      }
      if [event][action] =~ "denied" {
        mutate {
          replace => { "[event][action]" => "denied" }
        }
      }
      mutate {
        add_field => { "[service][state]" => "ssl_scanned: %{[scp][ssl_scanned]}" }
      }
      if [scp][av_scanned_up] {
        mutate {
          add_field => { "[service][state]" => "av_scanned_up: %{[scp][av_scanned_up]}" }
        }
      }
      if [scp][av_scanned_down] {
        mutate {
          add_field => { "[service][state]" => "av_scanned_down: %{[scp][av_scanned_down]}" }
        }
      }
      if [scp][rbi] {
        mutate {
          add_field => { "[service][state]" => "rbi: %{[scp][rbi]}" }
        }
      }
      if [scp][dlp] {
        mutate {
          add_field => { "[service][state]" => "dlp: %{[scp][dlp]}" }
        }
      }
	
  tld {
    source => "[url][domain]"
      target => "tmp"
  }
  if [tmp][domain] and (![url][registered_domain] or [url][registered_domain] == "" ) {
    mutate {
      rename => { "[tmp][domain]" => "[url][registered_domain]" }
    }
  }
  if [tmp][sld] and (![url][subdomain] or [url][subdomain] == "" ) {
    mutate {
      rename => {  "[tmp][sld]" => "[url][subdomain]"  }
    }
  }
  if [tmp][tld] and (![url][top_level_domain] or [url][top_level_domain] == "" ) {
    mutate {
      rename => { "[tmp][tld]" => "[url][top_level_domain]" }
    }
  }
  date {
    match => [ "[event][created]", "UNIX" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
  }
  # "request_timestamp": "2025-04-21 16:00:46"
  date {
    match => [ "[event][ingested]", "ISO8601", "yyyy-MM-dd HH:mm:ss" ]
    timezone => "GMT"
    locale => "en"
    target => "[event][created]"
  }
  mutate {
    remove_field => [ "scp", "tmp" ]
  }
}
output {
  pipeline { send_to => [enrichments] }
}