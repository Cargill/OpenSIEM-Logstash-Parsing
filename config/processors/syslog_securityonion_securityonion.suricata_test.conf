input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "[event][dataset]" ]
    add_field => {
      "[event][module]" => "securityonion"
      "[event][dataset]" => "securityonion.suricata_test"
    }
  }
}
output {
  pipeline { send_to => [enrichments] }
}
