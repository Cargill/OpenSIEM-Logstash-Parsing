input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {

    mutate {
      add_field => { "[event][module]" => "layer7_tibco_ems" }
      add_field => { "[event][dataset]" => "layer7_tibco_ems.traffic" }
    }

}
output {
  pipeline { send_to => [enrichments] }
}
