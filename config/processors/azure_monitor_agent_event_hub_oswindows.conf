input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    remove_field => [ "event", "host" ]
  }
  mutate {
    add_field => { "[event][module]" => "windows" }
    add_field => { "[event][dataset]" => "windows_wef_events" }
  }
    json {
      source => "message"
      target => "tmp"
      tag_on_failure => "_jsonparsefailure_init"
    }  
  if [message] =~ "^.*?ScriptBlockText.*?$" and "_jsonparsefailure_init" in [tags] {
    grok {
      tag_on_failure => "_parsefailure_ScriptBlock"
      match => { "message" => '(?<a>^.*?),"ScriptBlockText":"(?<sb>.*?")(?<b>,".*?$)' }
      timeout_millis => 500
	  add_field => { "tmp_j" => "%{a}%{b}" }
      remove_tag => [ "_jsonparsefailure_init" ]
    }
    json {
      source => "tmp_j"
      target => "tmp"
      remove_field => [ "tmp_j", "a", "b" ]
    }
  }
  mutate {
    gsub => [ "[tmp][Correlation]", "[\{\}]", "" ]
  }
  mutate {
    rename => {
      "sb" => "[process][command_line]"
      "[tmp][TenantId]" => "[cloud][account][id]"
      "[tmp][TimeGenerated]" => "[event][created]"
      "[tmp][Provider]" => "[event][provider]"
      "[tmp][_Internal_WorkspaceResourceId]" => "[cloud][project][id]"
      "[tmp][_ResourceId]" => "[cloud][instance][name]"
      "[tmp][_ItemId]" => "[cloud][instance][id]"
      "[tmp][Channel]" => "[event][kind]"
      "[tmp][Computer]" => "[log][source][hostname]"
      "[tmp][EventData][AuthenticationPackageName]" => "[package][name]"
      "[tmp][EventData][IpAddress]" => "[source][ip]"
      "[tmp][EventData][IpPort]" => "[source][port]"
      "[tmp][EventData][KeyLength]" => "[tls][client][x509][public_key_size]"
      "[tmp][EventData][LmPackageName]" => "[user_agent][version]"
      "[tmp][EventData][LogonGuid]" => "[user][group][id]"
      "[tmp][EventData][TargetLogonGuid]" => "[destination][user][group][id]"
      "[tmp][EventData][LogonProcessName]" => "[process][name]"
      "[tmp][EventData][LogonType]" => "[rule][uuid]"
      "[tmp][EventData][ProcessId]" => "[process][pid]"
      "[tmp][EventData][ProcessName]" => "[process][name]"
      "[tmp][EventData][NewProcessId]" => "[process][pid]"
      "[tmp][EventData][SubjectUserName]" => "sourceuser_name"
      "[tmp][EventData][SubjectUserSid]" => "sourceuser_id"
      "[tmp][EventData][TargetSid]" => "[destination][user][id]"
      "[tmp][EventData][TargetDomainName]" => "[destination][domain]"
      "[tmp][EventData][WorkstationName]" => "[destination][address]"
      "[tmp][EventID]" => "[event][id]"
      "[tmp][Type]" => "[log][type]"
      "[tmp][EventData][Path]" => "[file][path]"
      "[tmp][EventData][Priority]" => "[event][risk_score]"
      "[tmp][EventData][TaskName]" => "[process][name]"
      "[tmp][EventData][ProcessID]" => "[process][pid]"
      "[tmp][Opcode]" => "[event][code]"
      "[tmp][EventData][ConnType]" => "[network][transport]"
      "[tmp][EventData][ClientIP]" => "client_ip"
      "[tmp][EventData][NewProcessName]" => "[process][name]"
      "[tmp][EventData][CommandLine]" => "[process][command_line]"
      "[tmp][EventData][ParentProcessName]" => "[process][parent][name]"
      "[tmp][EventData][Service]" => "[service][name]"
      "[tmp][EventData][ScriptBlockText]" => "[process][command_line]"
      "[tmp][EventData][PrivilegeList]" => "[event][action]"
      "[tmp][EventData][ObjectServer]" => "[process][thread][name]"
      "[tmp][EventRecordId]" => "[process][entity_id]"
      "[tmp][Correlation]" => "[trace][id]"
      "[tmp][Version]" => "[service][version]"
      "[tmp][SystemProcessId]" => "[process][parent][entity_id]"
      "[tmp][SystemThreadId]" => "[process][parent][thread][id]"
      "[tmp][EventData][ActionName]" => "[file][path]"
      "[tmp][EventData][TaskInstanceId]" => "[cloud][instance][id]"
      "[tmp][EventData][EnginePID]" => "[process][pid]"
      "[tmp][EventData][ResultCode]" => "[process][exit_code]"
      "[tmp][EventData][Address]" => "[source][ip]"
      "[tmp][EventData][SessionID]" => "[process][pid]"
      "[tmp][EventData][User]" => "[source][user][name]"
      "[tmp][EventData][ClientProcessId]" => "[process][pid]"
      "[tmp][EventData][Operation]" => "[process][command_line]"
      "[tmp][EventData][ClientMachine]" => "[host][hostname]"
      "[tmp][EventData][PossibleCause]" => "[rule][description]"
      "[tmp][EventData][Component]" => "[process][name]"
      "[tmp][EventLevelName]" => "[event][severity_name]"
      "[tmp][EventLevel]" => "[event][severity]"
      "[tmp][EventOriginId]" => "[service][id]"
      "[tmp][EventData][RuleName]" => "[rule][name]"
      "[tmp][EventData][RuleId]" => "[rule][id]"
      "[tmp][Task]" => "[event][sequence]"
      "[tmp][Keywords]" => "[rule][category]"
      "[tmp][EventData][AccountName]" => "[source][user][id]"
      "[tmp][EventData][AccountDomain]" => "[source][user][domain]"
      "[tmp][EventData][ClientName]" => "[client][user][name]"
      "[tmp][EventData][ClientAddress]" => "[client][ip]"
      "[tmp][EventData][LogonID]" => "[trace][id]"
      "[tmp][EventData][SessionName]" => "[service][name]"
      "[tmp][EventData][PackageName]" => "[package][name]"
      "[tmp][EventData][Workstation]" => "[source][address]"
      "[tmp][EventData][Status]" => "[process][code_signature][status]"
      "[tmp][EventData][SubjectLogonId]" => "[client][user][group][id]"
      "[tmp][EventData][ObjectName]" => "[file][path]"
      "[tmp][EventData][ObjectType]" => "[process][args]"
      "[tmp][EventData][HandleId]" => "[trace][id]"
      "[tmp][EventData][AccessMask]" => "[event][action]"
      "[tmp][EventData][ResourceAttributes]" => "[event][reason]"
      "[tmp][EventData][AccessGranted]" => "[event][action]"
      "[tmp][EventData][AccessRemoved]" => "[event][action]"
      "[tmp][EventData][MemberName]" => "[destination][user][name]"
      "[tmp][EventData][MemberSid]" => "[destination][user][id]"
      "[tmp][EventData][TargetUserSid]" => "[destination][user][id]"
      "[tmp][EventData][TargetOutboundDomainName]" => "[destination][user][domain]"
      "[tmp][EventData][TargetOutboundUserName]" => "destinationuser_name"
      "[tmp][EventData][TargetLogonId]" => "[user][id]"
      "[tmp][EventData][TargetLinkedLogonId]" => "[client][user][group][id]"
      "[tmp][EventData][ImpersonationLevel]" => "[rule][name]"
      "[tmp][EventData][TransmittedServices]" => "[service][name]"
      "[tmp][EventData][FailureReason]" => "[error][id]"
      "[tmp][EventData][SubStatus]" => "[event][reason]"
      "[tmp][EventData][SamAccountName]" => "[source][user][name]"
      "[tmp][EventData][UserPrincipalName]" => "[source][user][email]"
      "[tmp][EventData][TargetServerName]" => "[host][name]"
      "[tmp][EventData][PrimaryGroupId]" => "[source][user][group][id]"
      "[tmp][SystemUserId]" => "[user][id]"
      "[tmp][SourceSystem]" => "[process][name]"
      "[tmp][ManagementGroupName]" => "[group][name]"
      "[tmp][EventData][TargetUserName]" => "[destination][user][name]"
      "[tmp][EventData][SubjectDomainName]" => "[source][user][domain]"
      "[tmp][EventData][TimeGenerated]" => "[event][created]"
      "[tmp][EventData][ManagementGroupName]" => "[user][group][name]"
      "[tmp][EventData][ProviderPath]" => "[process][parent][name][text]"
      "[tmp][EventData][HostProcess]" => "[process][name]"
      "[tmp][EventData][ProviderName]" => "[process][parent][name]"
      "[tmp][EventData][MandatoryLabel]" => "[service][type]"
      "[tmp][EventData][ShareLocalPath]" => "[file][target_path]"
      "[tmp][EventData][ShareName]" => "[file][group]"
      "[tmp][EventData][RelativeTargetName]" => "[file][target_path]"
      "[tmp][EventData][AccessReason]" => "[event][reason]"
      "[tmp][EventData][AccessList]" => "[event][category]"
      "[tmp][EventData][TransactionId]" => "[transaction][id]"
      "[tmp][EventData][ServiceName]" => "[service][name]"
      "[tmp][EventData][ServiceType]" => "[service][type]"
      "[tmp][EventData][ParentProcessId]" => "[process][parent][pid]"
      "[tmp][EventData][ServiceStartType]" => "[service][state]"
      "[tmp][EventData][ServiceFileName]" => "[file][path]"
      "[tmp][EventData][ServiceAccount]" => "[service][node][name]"
      "[tmp][EventData][FQDN]" => "[source][domain]"
      "[tmp][EventData][ProfileChanged]" => "[event][category]"
      "[tmp][EventData][ImagePath]" => "[file][path]"
      "[tmp][EventData][StartType]" => "[event][type]"
      "[tmp][EventData][UserContext]" => "[source][user][name]"
      "[tmp][EventData][InstanceId]" => "[host][id]"
      "[tmp][EventData][TokenElevationType]" => "[package][type]"
    }

  }
  if [event][action] =~ "\t\t\t" {
    mutate {
      gsub => [
        "[event][action]", " \t\t\t", ", "
      ]
    }
    mutate {
      split => { "[event][action]" => "," }
    }

  }

  if [event][reason] =~ "\t\t\t\t" {
    mutate {
      gsub => [
        "[event][reason]", " \t\t\t\t", ","
      ]
    }
    mutate {
      split => { "[event][reason]" => "," }
    }

  }
  if [event][category] =~ "\t\t\t\t" {
    mutate {
      gsub => [
        "[event][category]", " \t\t\t\t", ","
      ]
    }
    mutate {
      split => { "[event][category]" => "," }
    }
  }
  if [destinationuser_name] {
    if [destinationuser_name] =~ "@" {
      dissect {
        mapping => {
          destinationuser_name => "%{[[destination][user][name]]}@%{[[destination][user][domain]]}"
        }
      }
      mutate {remove_field => ["destinationuser_name"]}
    }
    else {
      mutate {
        rename => {"destinationuser_name" => "[destination][user][name]"}
      }
    }
  }
  if [sourceuser_id] {
    if [sourceuser_id] =~ "@" {
      dissect {
        mapping => {
          sourceuser_id => "%{[[source][user][id]]}@%{[[source][user][domain]]}"
        }
      }
      mutate {remove_field => ["sourceuser_id"]}
    }
    else {
      mutate {
        rename => {"sourceuser_id" => "[source][user][id]"}
      }
    }
  }
  if [client_ip] {
    if [client_ip] =~ ":" {
      dissect {
        mapping => {
          client_ip => "%{[[client][ip]]}:%{[[client][port]]}"
        }
      }
      mutate {remove_field => ["client_ip"]}
    }
    else {
      mutate {
        rename => {"client_ip" => "[client][ip]"}
      }
    }
  }
  if [sourceuser_name] {
    if [sourceuser_name] =~ "@" {
      dissect {
        mapping => {
          sourceuser_name => "%{[[source][user][name]]}@%{[[source][user][domain]]}"
        }
      }
      mutate {remove_field => ["sourceuser_name"]}
    }
    else {
      mutate {
        rename => {"sourceuser_name" => "[source][user][name]"}
      }
    }
  }

  if [event][id] == "7036" {  
    mutate {
      rename => { "[tmp][EventData][param1]" => "[service][name]" }
      rename => { "[tmp][EventData][param2]" => "[service][state]" }
    }
  }
  if [event][id] == "1149" {  
    mutate {
      rename => { "[tmp][EventData][Param1]" => "[source][user][name]" }
      rename => { "[tmp][EventData][Param2]" => "[source][user][domain]" }
      rename => { "[tmp][EventData][Param3]" => "[source][ip]" }
    }
  }

  if [event][id] == 4697 {
    translate {
      source => "[service][type]"
      target => "[service][type]"
      dictionary => {
        "0x1" => "Kernel_Driver"
        "0x2" => "File_system_driver"
        "0x8" => "Recognizer_driver"
        "0x10" => "win32_own_process"
        "0x20" => "win32_share_process"
        "0x110" => "interactive_own_process"
        "0x120" => "interactive_share_process"
      }
    }
    translate {
      source => "[service][state]"
      target => "[service][state]"
      dictionary => {
        "0" => "Boot"
        "1" => "System"
        "2" => "Automatic"
        "3" => "Manual"
        "4" => "Disabled"
      }
    }
  }
  translate {
    source => "[service][type]"
    target => "[service][type]"
    dictionary => {
      "S-1-16-0" => "Untrusted"
      "S-1-16-4096" => "Low integrity"
      "S-1-16-8192" => "Medium integrity"
      "S-1-16-8448" => "Medium high integrity"
      "S-1-16-12288" => "High integrity"
      "S-1-16-16384" => "System integrity"
      "S-1-16-20480" => "Protected process"
    }
  }
  translate {
    source => "[event][severity]"
    target => "[event][severity_name]"
    dictionary => {
      "1" => "Critical"
      "2" => "Error"
      "3" => "Warning"
      "4" => "Informational"
      "5" => "Verbose"
      "0" => "LogAlways"
    }
  }
  translate {
    source => "[error][id]"
    target => "[error][message]"
    dictionary => {
      "%%2305" => "ACCOUNT_EXPIRED"
      "%%2309" => "PASSWORD_EXPIRED"
      "%%2310" => "ACCOUNT_DISABLED"
      "%%2311" => "LOGON_TIME_RESTRICTION"
      "%%2312" => "USER_NOT_ALLOWED_WITH_THIS_DEVICE"
      "%%2313" => "UNKNOWN_USER_OR_BAD_PASSWORD"
      "%%2304" => "ERROR_DURING_LOGON"
    }
  }
  translate {
    source => "[event][reason]"
    target => "[event][reason]"
    dictionary => {
      "%%2305" => "ACCOUNT_EXPIRED"
      "%%2309" => "PASSWORD_EXPIRED"
      "%%2310" => "ACCOUNT_DISABLED"
      "%%2311" => "LOGON_TIME_RESTRICTION"
      "%%2312" => "USER_NOT_ALLOWED_WITH_THIS_DEVICE"
      "%%2313" => "UNKNOWN_USER_OR_BAD_PASSWORD"
      "%%2304" => "ERROR_DURING_LOGON"
    }
  }
  if [event][id] == 4688 {
    translate {
      source => "[package][type]"
      target => "[package][type]"
      dictionary => {
        	"%%1936" =>	"FULL_TOKEN"
          "%%1937" =>	"ELEVATED_TOKEN"
          "%%1938" =>	"LIMITED_TOKEN"
      }
    }
  }
  if [event][id] == 4624 or [event][id] == 4625 {
    if [tmp][EventData][RestrictedAdminMode] == "%%1842" {
      mutate {
          add_tag => [ "RestrictedAdminMode", "RemoteInteractiveLogon" ]
      }
    }
    if [tmp][EventData][ElevatedToken] == "%%1842" {
      mutate {
          add_tag => [ "ElevatedToken" ]
      }
    }
    if [tmp][EventData][VirtualAccount] == "%%1842" {
      mutate {
          add_tag => [ "VirtualAccount" ]
      }
    }
    translate {
      source => "[rule][name]"
      target => "[rule][name]"
      dictionary => {
        	"%%1832" =>	"Identification"
          "%%1833" =>	"Impersonation"
          "%%1840" =>	"Delegation"
          "%%1841" =>	"Denied by Process Trust Label ACE"
          "%%1842" =>	"Yes"
          "%%1843" =>	"No"
          "%%1844" =>	"System"
          "%%1845" =>	"Not Available"
          "%%1846" =>	"Default"
          "%%1847" =>	"DisallowMmConfig"
          "%%1848" =>	"Off"
          "%%1849" =>	"Auto"
      }
    }
  }

  if [event][id] == 4625 {
    translate {
      source => "[event][reason]"
      target => "[event][reason]"
      dictionary => {
        	"0xC0000234" => "ACCOUNT_LOCKED"
          "0xC0000193" => "ACCOUNT_EXPIRED"
          "0xC0000133" => "CLOCKS_OUT_OF_SYNC"
          "0xC0000224" => "PASSWORD_CHANGE_REQUIRED"
          "0xc000015b" => "NO_LOGON_RIGHT"
          "0xc000006d" => "LOGON_FAILURE"
          "0xc000006e" => "ACCOUNT_RESTRICTION"
          "0xc00002ee" => "ERROR_DURING_LOGON"
          "0xC0000071" => "PASSWORD_EXPIRED"
          "0xC0000072" => "ACCOUNT_DISABLED"
          "0xc000006a" => "INCORRECT_PASSWORD"
          "0xc0000064" => "ACCOUNT_DOES_NOT_EXIST"
          "0xC0000413" => "FIREWELL_PROHIBITS_LOGON"
      }
    }
    translate {
      source => "[event][reason]"
      target => "[event][reason]"
      dictionary => {
        	"0xC0000234" => "ACCOUNT_LOCKED"
          "0xC0000193" => "ACCOUNT_EXPIRED"
          "0xC0000133" => "CLOCKS_OUT_OF_SYNC"
          "0xC0000224" => "PASSWORD_CHANGE_REQUIRED"
          "0xc000015b" => "NO_LOGON_RIGHT"
          "0xc000006d" => "LOGON_FAILURE"
          "0xc000006e" => "ACCOUNT_RESTRICTION"
          "0xc00002ee" => "ERROR_DURING_LOGON"
          "0xC0000071" => "PASSWORD_EXPIRED"
          "0xC0000072" => "ACCOUNT_DISABLED"
          "0xc000006a" => "INCORRECT_PASSWORD"
          "0xc0000064" => "ACCOUNT_DOES_NOT_EXIST"
          "0xC0000413" => "FIREWELL_PROHIBITS_LOGON"
      }
    }
    translate {
      source => "[process][code_signature][status]"
      target => "[process][code_signature][status]"
      dictionary => {
        	"0xC0000234" => "ACCOUNT_LOCKED"
          "0xC0000193" => "ACCOUNT_EXPIRED"
          "0xC0000133" => "CLOCKS_OUT_OF_SYNC"
          "0xC0000224" => "PASSWORD_CHANGE_REQUIRED"
          "0xc000015b" => "NO_LOGON_RIGHT"
          "0xc000006d" => "LOGON_FAILURE"
          "0xc000006e" => "ACCOUNT_RESTRICTION"
          "0xc00002ee" => "ERROR_DURING_LOGON"
          "0xC0000071" => "PASSWORD_EXPIRED"
          "0xC0000072" => "ACCOUNT_DISABLED"
          "0xc000006a" => "INCORRECT_PASSWORD"
          "0xc0000064" => "ACCOUNT_DOES_NOT_EXIST"
          "0xC0000413" => "FIREWELL_PROHIBITS_LOGON"
      }
    }
  }
  if [event][id] in ["4663", "5140", "5145" ] {
    translate {
      source => "[event][action]"
      target => "[event][action]"
      dictionary => {
        "0x1" => "ReadData (or ListDirectory)"
        "0x2" => "WriteData (or AddFile)"
        "0x4" => "AppendData (or AddSubdirectory or CreatePipeInstance)"
        "0x8" => "ReadEA (extended attribute)"
        "0x10" => "WriteEA (extended attribute)"
        "0x20" => "Execute/Traverse"
        "0x40" => "DeleteChild"
        "0x80" => "ReadAttributes"
        "0x100" => "WriteAttributes"
        "0x10000" => "Delete"
        "0x20000" => "READ_CONTROL"
        "0x40000" => "WRITE_DAC"
        "0x80000" => "WRITE_OWNER"
        "0x100000" => "SYNCHRONIZE"
        "0x1000000" => "ACCESS_SYS_SEC"
      }
    }
    translate {
      source => "[event][category]"
      target => "[event][category]"
      dictionary => {
        "0x1" => "ReadData (or ListDirectory)"
        "0x2" => "WriteData (or AddFile)"
        "0x4" => "AppendData (or AddSubdirectory or CreatePipeInstance)"
        "0x8" => "ReadEA (extended attribute)"
        "0x10" => "WriteEA (extended attribute)"
        "0x20" => "Execute/Traverse"
        "0x40" => "DeleteChild"
        "0x80" => "ReadAttributes"
        "0x100" => "WriteAttributes"
        "0x10000" => "Delete"
        "0x20000" => "READ_CONTROL"
        "0x40000" => "WRITE_DAC"
        "0x80000" => "WRITE_OWNER"
        "0x100000" => "SYNCHRONIZE"
        "0x1000000" => "ACCESS_SYS_SEC"
      }
    }
  }
  
  if [tmp][EventData][ContextInfo] {
    mutate {
      gsub => [
        "[tmp][EventData][ContextInfo]", 'Host Name', 'HostName',
        "[tmp][EventData][ContextInfo]", 'Host Version', 'HostVersion',
        "[tmp][EventData][ContextInfo]", 'Host ID', 'HostID',
        "[tmp][EventData][ContextInfo]", 'Host Application', 'HostApplication',
        "[tmp][EventData][ContextInfo]", 'Engine Version', 'EngineVersion',
        "[tmp][EventData][ContextInfo]", 'Runspace ID', 'RunspaceID',
        "[tmp][EventData][ContextInfo]", 'Pipeline ID', 'PipelineID',
        "[tmp][EventData][ContextInfo]", 'Command Name', 'CommandName',
        "[tmp][EventData][ContextInfo]", 'Command Type', 'CommandType',
        "[tmp][EventData][ContextInfo]", 'Script Name', 'ScriptName',
        "[tmp][EventData][ContextInfo]", 'Command Path', 'CommandPath',
        "[tmp][EventData][ContextInfo]", 'Sequence Number', 'SequenceNumber',
        "[tmp][EventData][ContextInfo]", 'Connected User', 'ConnectedUser',
        "[tmp][EventData][ContextInfo]", 'Shell ID', 'ShellID',
        "[tmp][EventData][Payload]", '"', ''
      ]
    }

  #     allow_empty_values => true
    kv {
      source => "[tmp][EventData][ContextInfo]"
      target => "[tmp][EventData][ContextInfo_j]"
	  whitespace => "strict"
      value_split_pattern  => "= "
      field_split_pattern  => "  "
      tag_on_failure => "_kv_filter_1"
      transform_key => "lowercase"
      trim_key => " "
      trim_value => " "
    }
   # "Payload"
    grok {
      tag_on_failure => "_parsefailure_payload"
      match => { "[tmp][EventData][Payload]" => "^.*?: (?<[tmp][EventData][Payload_j][type]>.*?) .*?name=(?<[tmp][EventData][Payload_j][name]>.*?);.*?=(?<[tmp][EventData][Payload_j][value]>.*?)$" }
      timeout_millis => 500
	  remove_field => [  "[tmp][EventData][Payload]" ]
    }
    # [user][name]" # split
    mutate {
      rename => {
        "[tmp][EventData][ContextInfo_j][runspaceid]" => "[process][parent][pid]"
        "[tmp][EventData][ContextInfo_j][hostapplication]" => "[process][executable]"
        "[tmp][EventData][ContextInfo_j][hostid]" => "[host][id]"
        "[tmp][EventData][ContextInfo_j][sequencenumber]" => "[event][sequence]"
        "[tmp][EventData][ContextInfo_j][shellid]" => "[process][name]"
        "[tmp][EventData][ContextInfo_j][user]" => "[user][name]"
        "[tmp][EventData][ContextInfo_j][hostversion]" => "[host][os][kernel]"
        "[tmp][EventData][ContextInfo_j][severity]" => "[event][severity]"
        "[tmp][EventData][ContextInfo_j][hostname]" => "[host][name]"
        "[tmp][EventData][ContextInfo_j][commandname]" => "[process][command_line]"
        "[tmp][EventData][ContextInfo_j][engineversion]" => "[file][pe][file_version]"
      }
    }
  }

  if [user][name] =~ "^.*?\\.*?$" {
    mutate {
      rename => {
        "[user][name]" => "tmp_usr"
      }
    }
    grok {
      tag_on_failure => "_parsefailure_user"
      match => { "tmp_usr" => "^(?<[user][domain]>.*?)\\(?<[user][name]>.*?)$" }
      timeout_millis => 500
	  remove_field => [  "tmp_usr" ]
    }
  }
  # "[event][created]" "2024-07-16T17:25:22.2803769Z"
  date {
    match => ["[event][created]", "ISO8601"]
    timezone => "GMT"
    locale => "ec"
    target => "[event][created]"
    tag_on_failure => "_dateparsefailure_ec"
  }    
  # mutate {
  #   copy => { "tmp" => "[event][original]" }
  # }
  json_encode {
    source => "tmp"
    target => "[event][original]"
  }
  mutate {
    remove_field => [ "tmp" ]
  }
}
output {
  pipeline { send_to => [enrichments] }
}