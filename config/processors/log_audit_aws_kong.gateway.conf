input {
  pipeline {
    address => VAR_PIPELINE_NAME
  }
}
filter {
  mutate {
    add_field => { "[event][module]" => "kong" }
    add_field => { "[event][dataset]" => "kong.gateway" }
  }
}
output {
  pipeline { send_to => [enrichments] }
}
